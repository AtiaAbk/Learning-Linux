<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs>
  <style>
    @media (prefers-color-scheme: light) {
      /* Backgrounds & Cards */
      rect[fill="url(#bg)"], rect[fill="#0b0f1a"], rect[fill="#0d1117"], rect[fill="#0a0d14"], rect[fill="#0e1320"], rect[fill="#121826"] {
        fill: #f6f8fa !important;
      }
      linearGradient#bg stop:nth-child(1) { stop-color: #ffffff !important; }
      linearGradient#bg stop:nth-child(2) { stop-color: #f6f8fa !important; }
      linearGradient#bg stop:nth-child(3) { stop-color: #edf2f7 !important; }

      rect[fill="#161b22"], rect[fill="#151b28"], rect[fill="#1a2030"] {
        fill: #ffffff !important;
        stroke: #d0d7de !important;
      }
      rect[fill="#0d1117"], rect[fill="#101522"] { fill: #f6f8fa !important; }
      rect[stroke="#30363d"], line[stroke="#30363d"] { stroke: #d0d7de !important; }
      rect[stroke="#21262d"], line[stroke="#21262d"] { stroke: #d0d7de !important; }

      /* Typography */
      text[fill="#ffffff"], text[fill="#e6edf3"], text[fill="#f0f6fc"], text[fill="#f8fafc"] {
        fill: #1f2328 !important;
      }
      text[fill="#8b949e"], text[fill="#c9d1d9"], text[fill="#94a3b8"] {
        fill: #57606a !important;
      }
      text[fill="#7d8590"] { fill: #656d76 !important; }

      /* Shapes & Patterns */
      pattern circle { fill: #0969da !important; opacity: 0.07 !important; }
      circle[fill="#0d1117"], circle[fill="#161b22"], circle[fill="#0b0f1a"] { fill: #ffffff !important; }
    }
  </style>
</defs>
<rect width="800" height="290" rx="16" fill="#0d1117"/>
<text x="400" y="36" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">mkdir -p in Action</text>
<rect x="40" y="56" width="720" height="210" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<rect x="40" y="56" width="720" height="30" rx="12" fill="#30363d"/>
<circle cx="64" cy="71" r="6" fill="#f85149"/><circle cx="84" cy="71" r="6" fill="#d29922"/><circle cx="104" cy="71" r="6" fill="#3fb950"/>
<text x="70" y="124" fill="#3fb950" font-size="20" font-family="SFMono-Regular, Consolas, Menlo, monospace">$ <tspan fill="#e6edf3">mkdir -p animals/cats/persian</tspan></text>
<text x="70" y="170" fill="#58a6ff" font-size="22" font-family="SFMono-Regular, Consolas, Menlo, monospace" xml:space="preserve" opacity="0">animals/<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.15;0.92;1" dur="8s" repeatCount="indefinite"/></text>
<text x="70" y="198" fill="#58a6ff" font-size="22" font-family="SFMono-Regular, Consolas, Menlo, monospace" xml:space="preserve" opacity="0">└── cats/<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.30;0.33;0.92;1" dur="8s" repeatCount="indefinite"/></text>
<text x="70" y="226" fill="#58a6ff" font-size="22" font-family="SFMono-Regular, Consolas, Menlo, monospace" xml:space="preserve" opacity="0">    └── persian/<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.51;0.92;1" dur="8s" repeatCount="indefinite"/></text>
<text x="400" y="250" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >One command creates every missing parent directory</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
