="0.9" class="flow" marker-end="url(#arr-orange)"/><circle r="4.5" fill="#fb923c" filter="url(#glow)"><animateMotion dur="2.2s" begin="0.3s" repeatCount="indefinite" path="M500,204 C500,235 640,230 640,260"/></circle><path d="M260,320 C260,350 400,345 410,372" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-green)"/><circle r="4.5" fill="#4ade80" filter="url(#glow)"><animateMotion dur="2.2s" begin="0.3s" repeatCount="indefinite" path="M260,320 C260,350 400,345 410,372"/></circle><path d="M640,320 C640,350 500,345 490,372" fill="none" stroke="#fb923c" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-orange)"/><circle r="4.5" fill="#fb923c" filter="url(#glow)"><animateMotion dur="2.2s" begin="0.3s" repeatCount="indefinite" path="M640,320 C640,350 500,345 490,372"/></circle><g class="pop" style="animation-delay:0.80s"><rect x="250" y="372" width="400" height="56" rx="12" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".9" stroke-width="1.5"/><rect x="264" y="371.25" width="372" height="3" rx="1.5" fill="#f472b6"/><text x="450.0" y="404.8" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="700">session setup · limits · groups</text></g><path d="M450,430 V460" fill="none" stroke="#f472b6" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-pink)"/><g class="pop" style="animation-delay:0.95s"><rect x="300" y="462" width="300" height="54" rx="12" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".9" stroke-width="1.5"/><rect x="314" y="461.25" width="272" height="3" rx="1.5" fill="#2dd4bf"/><text x="450.0" y="493.8" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="700">user's shell or session</text></g><circle r="5" fill="#2dd4bf" filter="url(#glow)"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M450,204 V462"/></circle></g><rect x=".75" y=".7