<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Directory namespace mapped to physical and logical storage"><title>Directory namespace mapped to physical and logical storage</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#171d42"/></linearGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern><clipPath id="clip"><rect width="900" height="470" rx="20"/></clipPath><marker id="arr-cyan" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#22d3ee"/></marker><marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#60a5fa"/></marker><marker id="arr-violet" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#a78bfa"/></marker><marker id="arr-pink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#f472b6"/></marker><marker id="arr-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fb923c"/></marker><marker id="arr-yellow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#facc15"/></marker><marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#4ade80"/></marker><marker id="arr-red" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#f87171"/></marker><marker id="arr-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#2dd4bf"/></marker><marker id="arr-slate" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#94a3b8"/></marker></defs><style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'DejaVu Sans Mono',monospace}
.flow{stroke-dasharray:7 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:float 4.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pop{animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style><rect width="900" height="470" rx="20" fill="url(#bg)"/><rect width="900" height="470" rx="20" fill="url(#dots)"/><g clip-path="url(#clip)"><text x="175" y="62" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="700" letter-spacing="3">DIRECTORY NAMESPACE</text><text x="725" y="62" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="700" letter-spacing="3">PHYSICAL / LOGICAL STORAGE</text><g class="pop" style="animation-delay:0.00s"><rect x="30" y="84" width="290" height="52" rx="12" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".9" stroke-width="1.5"/><rect x="44" y="83.25" width="262" height="3" rx="1.5" fill="#60a5fa"/><text x="175.0" y="106.8" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/</text><text x="175.0" y="124.5" font-size="11.5" fill="#94a3b8" text-anchor="middle">root of the tree</text></g><g class="pop" style="animation-delay:0.10s"><rect x="580" y="84" width="290" height="52" rx="12" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".9" stroke-width="1.5"/><rect x="594" y="83.25" width="262" height="3" rx="1.5" fill="#60a5fa"/><text x="725.0" y="106.0" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="700">SSD partition / logical volume</text><text x="725.0" y="123.0" font-size="11.5" fill="#94a3b8" text-anchor="middle">holds / (etc, usr, …)</text></g><path d="M322,110 H578" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-blue)"/><circle r="4" fill="#60a5fa" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite" path="M322,110 H578"/></circle><g class="pop" style="animation-delay:0.30s"><rect x="414" y="99" width="72" height="22" rx="11.0" fill="#60a5fa" fill-opacity=".16" stroke="#60a5fa" stroke-opacity=".8" stroke-width="1.2"/><text x="450.0" y="113.8" font-size="11" fill="#f1f5f9" text-anchor="middle" font-weight="700" class="m">mount</text></g><g class="pop" style="animation-delay:0.12s"><rect x="30" y="152" width="290" height="52" rx="12" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-opacity=".9" stroke-width="1.5"/><rect x="44" y="151.25" width="262" height="3" rx="1.5" fill="#4ade80"/><text x="175.0" y="174.8" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/home</text><text x="175.0" y="192.4" font-size="11.5" fill="#94a3b8" text-anchor="middle">user data</text></g><g class="pop" style="animation-delay:0.22s"><rect x="580" y="152" width="290" height="52" rx="12" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-opacity=".9" stroke-width="1.5"/><rect x="594" y="151.25" width="262" height="3" rx="1.5" fill="#4ade80"/><text x="725.0" y="173.9" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="700">separate /home filesystem</text><text x="725.0" y="190.9" font-size="11.5" fill="#94a3b8" text-anchor="middle">local disk or network</text></g><path d="M322,178 H578" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-green)"/><circle r="4" fill="#4ade80" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite" path="M322,178 H578"/></circle><g class="pop" style="animation-delay:0.40s"><rect x="414" y="167" width="72" height="22" rx="11.0" fill="#4ade80" fill-opacity=".16" stroke="#4ade80" stroke-opacity=".8" stroke-width="1.2"/><text x="450.0" y="181.8" font-size="11" fill="#f1f5f9" text-anchor="middle" font-weight="700" class="m">mount</text></g><g class="pop" style="animation-delay:0.24s"><rect x="30" y="220" width="290" height="52" rx="12" fill="#fb923c" fill-opacity=".12" stroke="#fb923c" stroke-opacity=".9" stroke-width="1.5"/><rect x="44" y="219.25" width="262" height="3" rx="1.5" fill="#fb923c"/><text x="175.0" y="242.8" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/var</text><text x="175.0" y="260.4" font-size="11.5" fill="#94a3b8" text-anchor="middle">logs · state</text></g><g class="pop" style="animation-delay:0.34s"><rect x="580" y="220" width="290" height="52" rx="12" fill="#fb923c" fill-opacity=".12" stroke="#fb923c" stroke-opacity=".9" stroke-width="1.5"/><rect x="594" y="219.25" width="262" height="3" rx="1.5" fill="#fb923c"/><text x="725.0" y="241.9" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="700">separate /var filesystem</text><text x="725.0" y="258.9" font-size="11.5" fill="#94a3b8" text-anchor="middle">optional</text></g><path d="M322,246 H578" fill="none" stroke="#fb923c" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-orange)"/><circle r="4" fill="#fb923c" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M322,246 H578"/></circle><g class="pop" style="animation-delay:0.50s"><rect x="414" y="235" width="72" height="22" rx="11.0" fill="#fb923c" fill-opacity=".16" stroke="#fb923c" stroke-opacity=".8" stroke-width="1.2"/><text x="450.0" y="249.8" font-size="11" fill="#f1f5f9" text-anchor="middle" font-weight="700" class="m">mount</text></g><g class="pop" style="animation-delay:0.36s"><rect x="30" y="288" width="290" height="52" rx="12" fill="#f87171" fill-opacity=".12" stroke="#f87171" stroke-opacity=".9" stroke-width="1.5"/><rect x="44" y="287.25" width="262" height="3" rx="1.5" fill="#f87171"/><text x="175.0" y="310.9" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/boot/efi</text><text x="175.0" y="328.4" font-size="11.5" fill="#94a3b8" text-anchor="middle">boot files</text></g><g class="pop" style="animation-delay:0.46s"><rect x="580" y="288" width="290" height="52" rx="12" fill="#f87171" fill-opacity=".12" stroke="#f87171" stroke-opacity=".9" stroke-width="1.5"/><rect x="594" y="287.25" width="262" height="3" rx="1.5" fill="#f87171"/><text x="725.0" y="309.9" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="700">EFI System Partition</text><text x="725.0" y="326.9" font-size="11.5" fill="#94a3b8" text-anchor="middle">FAT filesystem</text></g><path d="M322,314 H578" fill="none" stroke="#f87171" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-red)"/><circle r="4" fill="#f87171" filter="url(#glow)"><animateMotion dur="2.4s" begin="1.2000000000000002s" repeatCount="indefinite" path="M322,314 H578"/></circle><g class="pop" style="animation-delay:0.60s"><rect x="414" y="303" width="72" height="22" rx="11.0" fill="#f87171" fill-opacity=".16" stroke="#f87171" stroke-opacity=".8" stroke-width="1.2"/><text x="450.0" y="317.9" font-size="11" fill="#f1f5f9" text-anchor="middle" font-weight="700" class="m">mount</text></g><g class="pop" style="animation-delay:0.48s"><rect x="30" y="356" width="290" height="52" rx="12" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".9" stroke-width="1.5"/><rect x="44" y="355.25" width="262" height="3" rx="1.5" fill="#2dd4bf"/><text x="175.0" y="378.9" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/mnt/backup</text><text x="175.0" y="396.4" font-size="11.5" fill="#94a3b8" text-anchor="middle">manual mount</text></g><g class="pop" style="animation-delay:0.58s"><rect x="580" y="356" width="290" height="52" rx="12" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".9" stroke-width="1.5"/><rect x="594" y="355.25" width="262" height="3" rx="1.5" fill="#2dd4bf"/><text x="725.0" y="377.9" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="700">external disk</text><text x="725.0" y="394.9" font-size="11.5" fill="#94a3b8" text-anchor="middle">mounted here</text></g><path d="M322,382 H578" fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-teal)"/><circle r="4" fill="#2dd4bf" filter="url(#glow)"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M322,382 H578"/></circle><g class="pop" style="animation-delay:0.70s"><rect x="414" y="371" width="72" height="22" rx="11.0" fill="#2dd4bf" fill-opacity=".16" stroke="#2dd4bf" stroke-opacity=".8" stroke-width="1.2"/><text x="450.0" y="385.9" font-size="11" fill="#f1f5f9" text-anchor="middle" font-weight="700" class="m">mount</text></g><text x="450" y="452" font-size="12.5" fill="#94a3b8" text-anchor="middle">Once mounted, the new filesystem hides the directory's previous contents until it is unmounted.</text></g><rect x=".75" y=".75" width="898.5" height="468.5" rx="19.5" fill="none" stroke="#2b3566" stroke-width="1.5"/></svg>