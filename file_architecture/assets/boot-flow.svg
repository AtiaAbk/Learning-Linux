<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="Simplified UEFI Linux boot sequence"><title>Simplified UEFI Linux boot sequence</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#171d42"/></linearGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern><clipPath id="clip"><rect width="900" height="640" rx="20"/></clipPath><marker id="arr-cyan" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#22d3ee"/></marker><marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#60a5fa"/></marker><marker id="arr-violet" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#a78bfa"/></marker><marker id="arr-pink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#f472b6"/></marker><marker id="arr-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fb923c"/></marker><marker id="arr-yellow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#facc15"/></marker><marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#4ade80"/></marker><marker id="arr-red" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#f87171"/></marker><marker id="arr-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#2dd4bf"/></marker><marker id="arr-slate" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#94a3b8"/></marker></defs><style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'DejaVu Sans Mono',monospace}
.flow{stroke-dasharray:7 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:float 4.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pop{animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style><rect width="900" height="640" rx="20" fill="url(#bg)"/><rect width="900" height="640" rx="20" fill="url(#dots)"/><g clip-path="url(#clip)"><g class="pop" style="animation-delay:0.00s"><rect x="30" y="36" width="240" height="116" rx="14" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-width="1.6"/><circle cx="56" cy="64" r="14" fill="#22d3ee"/><text x="56" y="70" font-size="15" fill="#0b1020" text-anchor="middle" font-weight="700">1</text><text x="80" y="70" font-size="17" fill="#f8fafc" font-weight="700">Power on</text><text x="46" y="100" font-size="12" fill="#cbd5e1">hardware reset</text><text x="46" y="119" font-size="12" fill="#cbd5e1">firmware takes control</text></g><g class="pop" style="animation-delay:0.18s"><rect x="330" y="36" width="240" height="116" rx="14" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-width="1.6"/><circle cx="356" cy="64" r="14" fill="#60a5fa"/><text x="356" y="70" font-size="15" fill="#0b1020" text-anchor="middle" font-weight="700">2</text><text x="380" y="70" font-size="17" fill="#f8fafc" font-weight="700">UEFI firmware</text><text x="346" y="100" font-size="12" fill="#cbd5e1">initializes hardware</text><text x="346" y="119" font-size="12" fill="#cbd5e1">locates the boot entry</text></g><g class="pop" style="animation-delay:0.36s"><rect x="630" y="36" width="240" height="116" rx="14" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-width="1.6"/><circle cx="656" cy="64" r="14" fill="#a78bfa"/><text x="656" y="70" font-size="15" fill="#0b1020" text-anchor="middle" font-weight="700">3</text><text x="680" y="70" font-size="17" fill="#f8fafc" font-weight="700">EFI System Partition</text><text x="646" y="100" font-size="12" fill="#cbd5e1">FAT · e.g. /boot/efi</text><text x="646" y="119" font-size="12" fill="#cbd5e1">holds bootloader files</text></g><g class="pop" style="animation-delay:0.54s"><rect x="630" y="216" width="240" height="116" rx="14" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-width="1.6"/><circle cx="656" cy="244" r="14" fill="#f472b6"/><text x="656" y="250" font-size="15" fill="#0b1020" text-anchor="middle" font-weight="700">4</text><text x="680" y="250" font-size="17" fill="#f8fafc" font-weight="700">Bootloader</text><text x="646" y="280" font-size="12" fill="#cbd5e1">GRUB / systemd-boot</text><text x="646" y="299" font-size="12" fill="#cbd5e1">loads kernel + initramfs</text><text x="646" y="318" font-size="12" fill="#cbd5e1">passes the kernel cmdline</text></g><g class="pop" style="animation-delay:0.72s"><rect x="330" y="216" width="240" height="116" rx="14" fill="#fb923c" fill-opacity=".12" stroke="#fb923c" stroke-width="1.6"/><circle cx="356" cy="244" r="14" fill="#fb923c"/><text x="356" y="250" font-size="15" fill="#0b1020" text-anchor="middle" font-weight="700">5</text><text x="380" y="250" font-size="17" fill="#f8fafc" font-weight="700">Linux kernel</text><text x="346" y="280" font-size="12" fill="#cbd5e1">initializes memory, CPU,</text><text x="346" y="299" font-size="12" fill="#cbd5e1">drivers and the VFS</text></g><g class="pop" style="animation-delay:0.90s"><rect x="30" y="216" width="240" height="116" rx="14" fill="#facc15" fill-opacity=".12" stroke="#facc15" stroke-width="1.6"/><circle cx="56" cy="244" r="14" fill="#facc15"/><text x="56" y="250" font-size="15" fill="#0b1020" text-anchor="middle" font-weight="700">6</text><text x="80" y="250" font-size="17" fill="#f8fafc" font-weight="700">initramfs</text><text x="46" y="280" font-size="12" fill="#cbd5e1">early userspace environment</text><text x="46" y="299" font-size="12" fill="#cbd5e1">loads storage / crypto / LVM</text><text x="46" y="318" font-size="12" fill="#cbd5e1">mounts the real root fs</text></g><g class="pop" style="animation-delay:1.08s"><rect x="30" y="396" width="240" height="116" rx="14" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-width="1.6"/><circle cx="56" cy="424" r="14" fill="#2dd4bf"/><text x="56" y="430" font-size="15" fill="#0b1020" text-anchor="middle" font-weight="700">7</text><text x="80" y="430" font-size="17" fill="#f8fafc" font-weight="700">Switch root</text><text x="46" y="460" font-size="12" fill="#cbd5e1">switch / pivot into the</text><text x="46" y="479" font-size="12" fill="#cbd5e1">real root filesystem</text></g><g class="pop" style="animation-delay:1.26s"><rect x="330" y="396" width="240" height="116" rx="14" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-width="1.6"/><circle cx="356" cy="424" r="14" fill="#4ade80"/><text x="356" y="430" font-size="15" fill="#0b1020" text-anchor="middle" font-weight="700">8</text><text x="380" y="430" font-size="17" fill="#f8fafc" font-weight="700">PID 1 · systemd</text><text x="346" y="460" font-size="12" fill="#cbd5e1">mounts filesystems</text><text x="346" y="479" font-size="12" fill="#cbd5e1">starts units &amp; services</text></g><g class="pop" style="animation-delay:1.44s"><rect x="630" y="396" width="240" height="116" rx="14" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-width="1.6"/><circle cx="656" cy="424" r="14" fill="#22d3ee"/><text x="656" y="430" font-size="15" fill="#0b1020" text-anchor="middle" font-weight="700">9</text><text x="680" y="430" font-size="17" fill="#f8fafc" font-weight="700">Ready</text><text x="646" y="460" font-size="12" fill="#cbd5e1">login prompt / GUI session</text><text x="646" y="479" font-size="12" fill="#cbd5e1">SSH availability</text></g><path d="M272,94 H328" fill="none" stroke="#22d3ee" stroke-width="2.6" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-cyan)"/><path d="M572,94 H628" fill="none" stroke="#60a5fa" stroke-width="2.6" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-blue)"/><path d="M750,154 V214" fill="none" stroke="#a78bfa" stroke-width="2.6" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-violet)"/><path d="M628,274 H572" fill="none" stroke="#f472b6" stroke-width="2.6" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-pink)"/><path d="M328,274 H272" fill="none" stroke="#fb923c" stroke-width="2.6" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-orange)"/><path d="M150,334 V394" fill="none" stroke="#facc15" stroke-width="2.6" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-yellow)"/><path d="M272,454 H328" fill="none" stroke="#2dd4bf" stroke-width="2.6" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-teal)"/><path d="M572,454 H628" fill="none" stroke="#4ade80" stroke-width="2.6" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-green)"/><circle r="7" fill="#f472b6" filter="url(#glow)"><animateMotion dur="12s" begin="0s" repeatCount="indefinite" path="M150,94 H750 V274 H150 V454 H750"/></circle><circle r="5" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="12s" begin="6s" repeatCount="indefinite" path="M150,94 H750 V274 H150 V454 H750"/></circle><text x="30" y="590" font-size="11" fill="#94a3b8" font-weight="700" letter-spacing="2.5">FILES TOUCHED</text><g class="pop" style="animation-delay:1.40s"><rect x="30" y="600" width="139" height="28" rx="14.0" fill="#f87171" fill-opacity=".16" stroke="#f87171" stroke-opacity=".8" stroke-width="1.2"/><text x="99.5" y="618.2" font-size="12" fill="#f1f5f9" text-anchor="middle" font-weight="700" class="m">/boot/vmlinuz-*</text></g><g class="pop" style="animation-delay:1.50s"><rect x="179" y="600" width="161" height="28" rx="14.0" fill="#facc15" fill-opacity=".16" stroke="#facc15" stroke-opacity=".8" stroke-width="1.2"/><text x="259.5" y="618.2" font-size="12" fill="#f1f5f9" text-anchor="middle" font-weight="700" class="m">/boot/initrd.img-*</text></g><g class="pop" style="animation-delay:1.60s"><rect x="350" y="600" width="102" height="28" rx="14.0" fill="#2dd4bf" fill-opacity=".16" stroke="#2dd4bf" stroke-opacity=".8" stroke-width="1.2"/><text x="401.0" y="618.2" font-size="12" fill="#f1f5f9" text-anchor="middle" font-weight="700" class="m">/etc/fstab</text></g><g class="pop" style="animation-delay:1.70s"><rect x="462" y="600" width="176" height="28" rx="14.0" fill="#4ade80" fill-opacity=".16" stroke="#4ade80" stroke-opacity=".8" stroke-width="1.2"/><text x="550.0" y="618.2" font-size="12" fill="#f1f5f9" text-anchor="middle" font-weight="700" class="m">/etc/systemd/system/</text></g></g><rect x=".75" y=".75" width="898.5" height="638.5" rx="19.5" fill="none" stroke="#2b3566" stroke-width="1.5"/></svg>