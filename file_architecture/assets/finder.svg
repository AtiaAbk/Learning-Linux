<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 648" width="900" height="648" role="img" aria-label="Where do I look? Directory finder"><title>Where do I look? Directory finder</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#171d42"/></linearGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern><clipPath id="clip"><rect width="900" height="648" rx="20"/></clipPath><marker id="arr-cyan" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#22d3ee"/></marker><marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#60a5fa"/></marker><marker id="arr-violet" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#a78bfa"/></marker><marker id="arr-pink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#f472b6"/></marker><marker id="arr-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fb923c"/></marker><marker id="arr-yellow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#facc15"/></marker><marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#4ade80"/></marker><marker id="arr-red" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#f87171"/></marker><marker id="arr-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#2dd4bf"/></marker><marker id="arr-slate" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#94a3b8"/></marker></defs><style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'DejaVu Sans Mono',monospace}
.flow{stroke-dasharray:7 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:float 4.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pop{animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style><rect width="900" height="648" rx="20" fill="url(#bg)"/><rect width="900" height="648" rx="20" fill="url(#dots)"/><g clip-path="url(#clip)"><text x="30" y="46" font-size="26" fill="#f8fafc" font-weight="700">Where do I look?</text><text x="30" y="70" font-size="13.5" fill="#94a3b8">Pick what you're searching for — follow it to the directory.</text><g class="pop" style="animation-delay:0.00s"><rect x="30" y="92" width="268" height="62" rx="12" fill="#facc15" fill-opacity=".11" stroke="#facc15" stroke-width="1.5"/><rect x="44" y="91.25" width="240" height="3" rx="1.5" fill="#facc15"/><text x="46" y="116" font-size="12.5" fill="#cbd5e1">System configuration?</text><text x="46" y="140" font-size="16" fill="#facc15" font-weight="700" class="m">→ /etc</text></g><g class="pop" style="animation-delay:0.06s"><rect x="322" y="92" width="268" height="62" rx="12" fill="#4ade80" fill-opacity=".11" stroke="#4ade80" stroke-width="1.5"/><rect x="336" y="91.25" width="240" height="3" rx="1.5" fill="#4ade80"/><text x="338" y="116" font-size="12.5" fill="#cbd5e1">A normal user's personal files?</text><text x="338" y="140" font-size="16" fill="#4ade80" font-weight="700" class="m">→ /home/USER</text></g><g class="pop" style="animation-delay:0.12s"><rect x="614" y="92" width="268" height="62" rx="12" fill="#4ade80" fill-opacity=".11" stroke="#4ade80" stroke-width="1.5"/><rect x="628" y="91.25" width="240" height="3" rx="1.5" fill="#4ade80"/><text x="630" y="116" font-size="12.5" fill="#cbd5e1">Root administrator's personal files?</text><text x="630" y="140" font-size="16" fill="#4ade80" font-weight="700" class="m">→ /root</text></g><g class="pop" style="animation-delay:0.18s"><rect x="30" y="168" width="268" height="62" rx="12" fill="#60a5fa" fill-opacity=".11" stroke="#60a5fa" stroke-width="1.5"/><rect x="44" y="167.25" width="240" height="3" rx="1.5" fill="#60a5fa"/><text x="46" y="192" font-size="12.5" fill="#cbd5e1">Installed command or library?</text><text x="46" y="216" font-size="16" fill="#60a5fa" font-weight="700" class="m">→ /usr (merged /bin, /lib)</text></g><g class="pop" style="animation-delay:0.24s"><rect x="322" y="168" width="268" height="62" rx="12" fill="#60a5fa" fill-opacity=".11" stroke="#60a5fa" stroke-width="1.5"/><rect x="336" y="167.25" width="240" height="3" rx="1.5" fill="#60a5fa"/><text x="338" y="192" font-size="12.5" fill="#cbd5e1">Locally installed software?</text><text x="338" y="216" font-size="16" fill="#60a5fa" font-weight="700" class="m">→ /usr/local</text></g><g class="pop" style="animation-delay:0.30s"><rect x="614" y="168" width="268" height="62" rx="12" fill="#f87171" fill-opacity=".11" stroke="#f87171" stroke-width="1.5"/><rect x="628" y="167.25" width="240" height="3" rx="1.5" fill="#f87171"/><text x="630" y="192" font-size="12.5" fill="#cbd5e1">Bootloader, kernel, initramfs?</text><text x="630" y="216" font-size="16" fill="#f87171" font-weight="700" class="m">→ /boot (+ EFI mount)</text></g><g class="pop" style="animation-delay:0.36s"><rect x="30" y="244" width="268" height="62" rx="12" fill="#22d3ee" fill-opacity=".11" stroke="#22d3ee" stroke-width="1.5"/><rect x="44" y="243.25" width="240" height="3" rx="1.5" fill="#22d3ee"/><text x="46" y="268" font-size="12.5" fill="#cbd5e1">Device node?</text><text x="46" y="292" font-size="16" fill="#22d3ee" font-weight="700" class="m">→ /dev</text></g><g class="pop" style="animation-delay:0.42s"><rect x="322" y="244" width="268" height="62" rx="12" fill="#a78bfa" fill-opacity=".11" stroke="#a78bfa" stroke-width="1.5"/><rect x="336" y="243.25" width="240" height="3" rx="1.5" fill="#a78bfa"/><text x="338" y="268" font-size="12.5" fill="#cbd5e1">Process or kernel information?</text><text x="338" y="292" font-size="16" fill="#a78bfa" font-weight="700" class="m">→ /proc</text></g><g class="pop" style="animation-delay:0.48s"><rect x="614" y="244" width="268" height="62" rx="12" fill="#a78bfa" fill-opacity=".11" stroke="#a78bfa" stroke-width="1.5"/><rect x="628" y="243.25" width="240" height="3" rx="1.5" fill="#a78bfa"/><text x="630" y="268" font-size="12.5" fill="#cbd5e1">Device model / kernel attributes?</text><text x="630" y="292" font-size="16" fill="#a78bfa" font-weight="700" class="m">→ /sys</text></g><g class="pop" style="animation-delay:0.54s"><rect x="30" y="320" width="268" height="62" rx="12" fill="#f472b6" fill-opacity=".11" stroke="#f472b6" stroke-width="1.5"/><rect x="44" y="319.25" width="240" height="3" rx="1.5" fill="#f472b6"/><text x="46" y="344" font-size="12.5" fill="#cbd5e1">Runtime socket or transient state?</text><text x="46" y="368" font-size="16" fill="#f472b6" font-weight="700" class="m">→ /run</text></g><g class="pop" style="animation-delay:0.60s"><rect x="322" y="320" width="268" height="62" rx="12" fill="#fb923c" fill-opacity=".11" stroke="#fb923c" stroke-width="1.5"/><rect x="336" y="319.25" width="240" height="3" rx="1.5" fill="#fb923c"/><text x="338" y="344" font-size="12.5" fill="#cbd5e1">Logs?</text><text x="338" y="368" font-size="16" fill="#fb923c" font-weight="700" class="m">→ /var/log or journal</text></g><g class="pop" style="animation-delay:0.66s"><rect x="614" y="320" width="268" height="62" rx="12" fill="#fb923c" fill-opacity=".11" stroke="#fb923c" stroke-width="1.5"/><rect x="628" y="319.25" width="240" height="3" rx="1.5" fill="#fb923c"/><text x="630" y="344" font-size="12.5" fill="#cbd5e1">Service database / state?</text><text x="630" y="368" font-size="16" fill="#fb923c" font-weight="700" class="m">→ /var/lib</text></g><g class="pop" style="animation-delay:0.72s"><rect x="30" y="396" width="268" height="62" rx="12" fill="#fb923c" fill-opacity=".11" stroke="#fb923c" stroke-width="1.5"/><rect x="44" y="395.25" width="240" height="3" rx="1.5" fill="#fb923c"/><text x="46" y="420" font-size="12.5" fill="#cbd5e1">Downloaded / re-creatable cache?</text><text x="46" y="444" font-size="16" fill="#fb923c" font-weight="700" class="m">→ /var/cache</text></g><g class="pop" style="animation-delay:0.78s"><rect x="322" y="396" width="268" height="62" rx="12" fill="#fb923c" fill-opacity=".11" stroke="#fb923c" stroke-width="1.5"/><rect x="336" y="395.25" width="240" height="3" rx="1.5" fill="#fb923c"/><text x="338" y="420" font-size="12.5" fill="#cbd5e1">Queued jobs?</text><text x="338" y="444" font-size="16" fill="#fb923c" font-weight="700" class="m">→ /var/spool</text></g><g class="pop" style="animation-delay:0.84s"><rect x="614" y="396" width="268" height="62" rx="12" fill="#fb923c" fill-opacity=".11" stroke="#fb923c" stroke-width="1.5"/><rect x="628" y="395.25" width="240" height="3" rx="1.5" fill="#fb923c"/><text x="630" y="420" font-size="12.5" fill="#cbd5e1">Temporary scratch file?</text><text x="630" y="444" font-size="16" fill="#fb923c" font-weight="700" class="m">→ /tmp or /var/tmp</text></g><g class="pop" style="animation-delay:0.90s"><rect x="30" y="472" width="268" height="62" rx="12" fill="#2dd4bf" fill-opacity=".11" stroke="#2dd4bf" stroke-width="1.5"/><rect x="44" y="471.25" width="240" height="3" rx="1.5" fill="#2dd4bf"/><text x="46" y="496" font-size="12.5" fill="#cbd5e1">Removable disk mount?</text><text x="46" y="520" font-size="16" fill="#2dd4bf" font-weight="700" class="m">→ /media</text></g><g class="pop" style="animation-delay:0.96s"><rect x="322" y="472" width="268" height="62" rx="12" fill="#2dd4bf" fill-opacity=".11" stroke="#2dd4bf" stroke-width="1.5"/><rect x="336" y="471.25" width="240" height="3" rx="1.5" fill="#2dd4bf"/><text x="338" y="496" font-size="12.5" fill="#cbd5e1">Manual temporary mount?</text><text x="338" y="520" font-size="16" fill="#2dd4bf" font-weight="700" class="m">→ /mnt</text></g><g class="pop" style="animation-delay:1.02s"><rect x="614" y="472" width="268" height="62" rx="12" fill="#60a5fa" fill-opacity=".11" stroke="#60a5fa" stroke-width="1.5"/><rect x="628" y="471.25" width="240" height="3" rx="1.5" fill="#60a5fa"/><text x="630" y="496" font-size="12.5" fill="#cbd5e1">Optional vendor application?</text><text x="630" y="520" font-size="16" fill="#60a5fa" font-weight="700" class="m">→ /opt</text></g><g class="pop" style="animation-delay:1.08s"><rect x="30" y="548" width="268" height="62" rx="12" fill="#4ade80" fill-opacity=".11" stroke="#4ade80" stroke-width="1.5"/><rect x="44" y="547.25" width="240" height="3" rx="1.5" fill="#4ade80"/><text x="46" y="572" font-size="12.5" fill="#cbd5e1">Data offered by a service?</text><text x="46" y="596" font-size="16" fill="#4ade80" font-weight="700" class="m">→ /srv</text></g><rect x="322" y="548" width="548" height="62" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#334155"/><circle cx="338" cy="568" r="5" fill="#facc15"/><text x="349" y="572" font-size="11.5" fill="#cbd5e1">Config</text><circle cx="444" cy="568" r="5" fill="#4ade80"/><text x="455" y="572" font-size="11.5" fill="#cbd5e1">User data</text><circle cx="549" cy="568" r="5" fill="#60a5fa"/><text x="560" y="572" font-size="11.5" fill="#cbd5e1">Software</text><circle cx="655" cy="568" r="5" fill="#fb923c"/><text x="666" y="572" font-size="11.5" fill="#cbd5e1">Variable</text><circle cx="760" cy="568" r="5" fill="#f87171"/><text x="771" y="572" font-size="11.5" fill="#cbd5e1">Boot</text><circle cx="338" cy="592" r="5" fill="#a78bfa"/><text x="349" y="596" font-size="11.5" fill="#cbd5e1">Virtual</text><circle cx="444" cy="592" r="5" fill="#22d3ee"/><text x="455" y="596" font-size="11.5" fill="#cbd5e1">Devices</text><circle cx="549" cy="592" r="5" fill="#2dd4bf"/><text x="560" y="596" font-size="11.5" fill="#cbd5e1">Mounts</text><circle cx="655" cy="592" r="5" fill="#f472b6"/><text x="666" y="596" font-size="11.5" fill="#cbd5e1">Runtime</text></g><rect x=".75" y=".75" width="898.5" height="646.5" rx="19.5" fill="none" stroke="#2b3566" stroke-width="1.5"/></svg>