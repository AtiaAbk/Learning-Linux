<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-label="Identity lookup through the Name Service Switch"><title>Identity lookup through the Name Service Switch</title><defs>
  <style>
    @media (prefers-color-scheme: light) {
      /* Backgrounds & Cards */
      rect[fill="url(#bg)"], rect[fill="#0b0f1a"], rect[fill="#0d1117"], rect[fill="#0a0d14"], rect[fill="#0e1320"], rect[fill="#121826"] {
        fill: #f6f8fa !important;
      }
      linearGradient#bg stop:nth-child(1) { stop-color: #ffffff !important; }
      linearGradient#bg stop:nth-child(2) { stop-color: #f6f8fa !important; }
      linearGradient#bg stop:nth-child(3) { stop-color: #edf2f7 !important; }

      rect[fill="#161b22"], rect[fill="#151b28"], rect[fill="#1a2030"] {
        fill: #ffffff !important;
        stroke: #d0d7de !important;
      }
      rect[fill="#0d1117"], rect[fill="#101522"] { fill: #f6f8fa !important; }
      rect[stroke="#30363d"], line[stroke="#30363d"] { stroke: #d0d7de !important; }
      rect[stroke="#21262d"], line[stroke="#21262d"] { stroke: #d0d7de !important; }

      /* Typography */
      text[fill="#ffffff"], text[fill="#e6edf3"], text[fill="#f0f6fc"], text[fill="#f8fafc"] {
        fill: #1f2328 !important;
      }
      text[fill="#8b949e"], text[fill="#c9d1d9"], text[fill="#94a3b8"] {
        fill: #57606a !important;
      }
      text[fill="#7d8590"] { fill: #656d76 !important; }

      /* Shapes & Patterns */
      pattern circle { fill: #0969da !important; opacity: 0.07 !important; }
      circle[fill="#0d1117"], circle[fill="#161b22"], circle[fill="#0b0f1a"] { fill: #ffffff !important; }
    }
  </style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#171d42"/></linearGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern><clipPath id="clip"><rect width="900" height="490" rx="20"/></clipPath><marker id="arr-cyan" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#22d3ee"/></marker><marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#60a5fa"/></marker><marker id="arr-violet" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#a78bfa"/></marker><marker id="arr-pink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#f472b6"/></marker><marker id="arr-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fb923c"/></marker><marker id="arr-yellow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#facc15"/></marker><marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#4ade80"/></marker><marker id="arr-red" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#f87171"/></marker><marker id="arr-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#2dd4bf"/></marker><marker id="arr-slate" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#94a3b8"/></marker></defs><style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'DejaVu Sans Mono',monospace}
.flow{stroke-dasharray:7 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:float 4.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pop{animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style><rect width="900" height="490" rx="20" fill="url(#bg)"/><rect width="900" height="490" rx="20" fill="url(#dots)"/><g clip-path="url(#clip)"><g class="pop" style="animation-delay:0.00s"><rect x="270" y="24" width="360" height="52" rx="12" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".9" stroke-width="1.5"/><rect x="284" y="23.25" width="332" height="3" rx="1.5" fill="#22d3ee"/><text x="450.0" y="54.8" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="700">Program asks: "Who is UID 1000?"</text></g><g class="pop" style="animation-delay:0.15s"><rect x="300" y="112" width="300" height="52" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".9" stroke-width="1.5"/><rect x="314" y="111.25" width="272" height="3" rx="1.5" fill="#a78bfa"/><text x="450.0" y="143.1" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700">Name Service Switch (NSS)</text></g><g class="pop" style="animation-delay:0.30s"><rect x="320" y="200" width="260" height="48" rx="12" fill="#facc15" fill-opacity=".12" stroke="#facc15" stroke-opacity=".9" stroke-width="1.5"/><rect x="334" y="199.25" width="232" height="3" rx="1.5" fill="#facc15"/><text x="450.0" y="228.8" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/etc/nsswitch.conf</text></g><g class="pop" style="animation-delay:0.45s"><rect x="110" y="300" width="300" height="72" rx="12" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-opacity=".9" stroke-width="1.5"/><rect x="124" y="299.25" width="272" height="3" rx="1.5" fill="#4ade80"/><text x="260.0" y="332.6" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700">local files</text><text x="260.0" y="350.6" font-size="12" fill="#94a3b8" text-anchor="middle" class="m">/etc/passwd · /etc/group</text></g><g class="pop" style="animation-delay:0.60s"><rect x="490" y="300" width="300" height="72" rx="12" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".9" stroke-width="1.5"/><rect x="504" y="299.25" width="272" height="3" rx="1.5" fill="#60a5fa"/><text x="640.0" y="332.6" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700">LDAP / SSSD / other</text><text x="640.0" y="350.6" font-size="12" fill="#94a3b8" text-anchor="middle">configured identity source</text></g><g class="pop" style="animation-delay:0.75s"><rect x="300" y="420" width="300" height="50" rx="12" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".9" stroke-width="1.5"/><rect x="314" y="419.25" width="272" height="3" rx="1.5" fill="#f472b6"/><text x="450.0" y="449.8" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="700">resolved account / group</text></g><path d="M450,78 V110" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-cyan)"/><circle r="4.5" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="2.2s" begin="0.0s" repeatCount="indefinite" path="M450,78 V110"/></circle><path d="M450,166 V198" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-violet)"/><circle r="4.5" fill="#a78bfa" filter="url(#glow)"><animateMotion dur="2.2s" begin="0.25s" repeatCount="indefinite" path="M450,166 V198"/></circle><path d="M450,250 C450,280 260,270 260,298" fill="none" stroke="#facc15" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-yellow)"/><circle r="4.5" fill="#facc15" filter="url(#glow)"><animateMotion dur="2.2s" begin="0.5s" repeatCount="indefinite" path="M450,250 C450,280 260,270 260,298"/></circle><path d="M450,250 C450,280 640,270 640,298" fill="none" stroke="#facc15" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-yellow)"/><circle r="4.5" fill="#facc15" filter="url(#glow)"><animateMotion dur="2.2s" begin="0.75s" repeatCount="indefinite" path="M450,250 C450,280 640,270 640,298"/></circle><path d="M260,374 C260,400 400,392 420,418" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-green)"/><circle r="4.5" fill="#4ade80" filter="url(#glow)"><animateMotion dur="2.2s" begin="1.0s" repeatCount="indefinite" path="M260,374 C260,400 400,392 420,418"/></circle><path d="M640,374 C640,400 500,392 480,418" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-blue)"/><circle r="4.5" fill="#60a5fa" filter="url(#glow)"><animateMotion dur="2.2s" begin="1.25s" repeatCount="indefinite" path="M640,374 C640,400 500,392 480,418"/></circle><text x="450" y="288" font-size="11.5" fill="#64748b" text-anchor="middle">which source(s), in which order?</text></g><rect x=".75" y=".75" width="898.5" height="488.5" rx="19.5" fill="none" stroke="#2b3566" stroke-width="1.5"/></svg>