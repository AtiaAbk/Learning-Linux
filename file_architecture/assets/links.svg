700" class="m">inode #12345</text><text x="220.0" y="252.3" font-size="11" fill="#94a3b8" text-anchor="middle">perms · owner · size · link count = 2</text></g><g class="pop" style="animation-delay:0.50s"><rect x="110" y="330" width="220" height="54" rx="12" fill="#fb923c" fill-opacity=".12" stroke="#fb923c" stroke-opacity=".9" stroke-width="1.5"/><rect x="124" y="329.25" width="192" height="3" rx="1.5" fill="#fb923c"/><text x="220.0" y="353.5" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="700">data blocks</text><text x="220.0" y="370.3" font-size="11" fill="#94a3b8" text-anchor="middle">stored once</text></g><path d="M125,138 C125,170 190,170 200,198" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-green)"/><circle r="4.5" fill="#4ade80" filter="url(#glow)"><animateMotion dur="2.2s" begin="0.2s" repeatCount="indefinite" path="M125,138 C125,170 190,170 200,198"/></circle><path d="M335,138 C335,170 250,170 240,198" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-green)"/><circle r="4.5" fill="#4ade80" filter="url(#glow)"><animateMotion dur="2.2s" begin="0.2s" repeatCount="indefinite" path="M335,138 C335,170 250,170 240,198"/></circle><path d="M220,278 V328" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-blue)"/><circle r="4.5" fill="#60a5fa" filter="url(#glow)"><animateMotion dur="2.2s" begin="0.2s" repeatCount="indefinite" path="M220,278 V328"/></circle><text x="230" y="408" font-size="11.5" fill="#94a3b8" text-anchor="middle">same inode · same data · survives while ≥ 1 name remains</text><g class="pop" style="animation-delay:0.20s"><rect x="480" y="80" width="170" height="56" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".9" stroke-width="1.5"/><rect x="494" y="79.25" width="142" height="3" rx="1.5" fill="#a78bfa"/><text x="565.0" y="104.5" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">hosts-link</text><text x="565.0" y="121.3" font-size="11" fill="#94a3b8" text-anchor="middle">type l · stores a path</text></g><g class="pop" style="animation-delay:0.30s"><rect x="690" y="80" width="170" height="56" rx="12" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".9" stroke-width="1.5"/><rect x="704" y="79.25" width="142" height="3" rx="1.5" fill="#60a5fa"/><text x="775.0" y="104.5" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/etc/hosts</text><text x="775.0" y="121.3" font-size="11" fill="#94a3b8" text-anchor="middle">target name</text></g><g class="pop" style="animation-delay:0.50s"><rect x="690" y="200" width="170" height="76" rx="12" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".9" stroke-width="1.5"/><rect x="704" y="199.25" width="142" height="3" rx="1.5" fill="#60a5fa"/><text x="775.0" y="235.1" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">inode</text><text x="775.0" y="252.3" font-size="11" fill="#94a3b8" text-anchor="middle">regular file</text></g><g class="pop" style="animation-delay:0.60s"><rect x="690" y="330" width="170" height="54" rx="12" fill="#fb923c" fill-opacity=".12" stroke="#fb923c" stroke-opacity=".9" stroke-width="1.5"/><rect x="704" y="329.25" width="142" height="3" rx="1.5" fill="#fb923c"/><text x="775.0" y="361.5" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="700">data blocks</text></g><path d="M652,108 H688" fill="none" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-violet)"/><g class="pop" style="animation-delay:0.60s"><rect x="588" y="148" width="124" height="22" rx="11.0" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-opacity=".8" stroke-width="1.2"/><text x="650.0" y="162.7" font-size="10.5" fill="#f1f5f9" text-anchor="middle" font-weight="700" class="m">stores "/etc/hosts"</text></g><path d="M775,138 V198" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-blue)"/><circle r="4.5" fill="#60a5fa" filter="url(#glow)"><animateMotion dur="2.2s" begin="0.4s" repeatCount="indefinite" path="M775,138 V198"/></circle><path d="M775,278 V328" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-blue)"/><circle r="4.5" fill="#60a5fa" filter="url(#glow)"><animateMotion dur="2.2s" begin="0.4s" repeatCount="indefinite" path="M775,278 V328"/></circle><text x="670" y="300" font-size="12" fill="#94a3b8" text-anchor="middle">separate object that</text><text x="670" y="318" font-size="12" fill="#94a3b8" text-anchor="middle">contains a target path</text><text x="670" y="408" font-size="11.5" fill="#94a3b8" text-anchor="middle">can cross filesystems · can dangle if target is removed</text></g><rect x=".75" y=".75" width="898.5" height="438.5" rx="19.5" fill="none" stroke="#2b3566" stroke-width="1.5"/></svg>