<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="Where configuration, state, runtime data and logs usually live"><title>Where configuration, state, runtime data and logs usually live</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#171d42"/></linearGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern><clipPath id="clip"><rect width="900" height="580" rx="20"/></clipPath><marker id="arr-cyan" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#22d3ee"/></marker><marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#60a5fa"/></marker><marker id="arr-violet" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#a78bfa"/></marker><marker id="arr-pink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#f472b6"/></marker><marker id="arr-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fb923c"/></marker><marker id="arr-yellow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#facc15"/></marker><marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#4ade80"/></marker><marker id="arr-red" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#f87171"/></marker><marker id="arr-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#2dd4bf"/></marker><marker id="arr-slate" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#94a3b8"/></marker></defs><style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'DejaVu Sans Mono',monospace}
.flow{stroke-dasharray:7 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:float 4.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pop{animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style><rect width="900" height="580" rx="20" fill="url(#bg)"/><rect width="900" height="580" rx="20" fill="url(#dots)"/><g clip-path="url(#clip)"><text x="155" y="38" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="700" letter-spacing="3">ADMIN CONFIG</text><text x="450" y="38" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="700" letter-spacing="3">USER / APP</text><text x="745" y="38" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="700" letter-spacing="3">KERNEL / DEVICE</text><g class="pop" style="animation-delay:0.00s"><rect x="30" y="56" width="250" height="76" rx="12" fill="#facc15" fill-opacity=".12" stroke="#facc15" stroke-opacity=".9" stroke-width="1.5"/><rect x="44" y="55.25" width="222" height="3" rx="1.5" fill="#facc15"/><text x="155.0" y="91.5" font-size="20" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/etc</text><text x="155.0" y="110.1" font-size="12" fill="#94a3b8" text-anchor="middle">service reads configuration</text></g><g class="pop" style="animation-delay:0.10s"><rect x="325" y="56" width="250" height="56" rx="12" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-opacity=".9" stroke-width="1.5"/><rect x="339" y="55.25" width="222" height="3" rx="1.5" fill="#4ade80"/><text x="450.0" y="80.3" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/home  ·  /root</text><text x="450.0" y="98.1" font-size="12" fill="#94a3b8" text-anchor="middle">user runs an app</text></g><g class="pop" style="animation-delay:0.20s"><rect x="325" y="134" width="250" height="50" rx="12" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".9" stroke-width="1.5"/><rect x="339" y="133.25" width="222" height="3" rx="1.5" fill="#60a5fa"/><text x="450.0" y="155.6" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/usr/bin/app</text><text x="450.0" y="172.9" font-size="11.5" fill="#94a3b8" text-anchor="middle">installed program</text></g><g class="pop" style="animation-delay:0.30s"><rect x="620" y="56" width="250" height="76" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".9" stroke-width="1.5"/><rect x="634" y="55.25" width="222" height="3" rx="1.5" fill="#a78bfa"/><text x="745.0" y="90.6" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/proc · /sys · /dev</text><text x="745.0" y="108.6" font-size="12" fill="#94a3b8" text-anchor="middle">kernel &amp; device interfaces</text></g><path d="M450,114 V132" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-green)"/><g class="pop" style="animation-delay:0.50s"><rect x="330" y="246" width="240" height="58" rx="12" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".9" stroke-width="1.5"/><rect x="344" y="245.25" width="212" height="3" rx="1.5" fill="#f472b6"/><text x="450.0" y="272.1" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="700">service runs</text><text x="450.0" y="289.9" font-size="11.5" fill="#94a3b8" text-anchor="middle">process in memory</text></g><path d="M155,134 C155,200 380,190 380,246" fill="none" stroke="#facc15" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-yellow)"/><circle r="4.5" fill="#facc15" filter="url(#glow)"><animateMotion dur="2.8s" begin="0s" repeatCount="indefinite" path="M155,134 C155,200 380,190 380,246"/></circle><path d="M450,186 V244" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-blue)"/><circle r="4.5" fill="#60a5fa" filter="url(#glow)"><animateMotion dur="2.8s" begin="0.7s" repeatCount="indefinite" path="M450,186 V244"/></circle><path d="M745,134 C745,200 520,190 520,246" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-violet)"/><circle r="4.5" fill="#a78bfa" filter="url(#glow)"><animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite" path="M745,134 C745,200 520,190 520,246"/></circle><g class="pop" style="animation-delay:0.70s"><rect x="60" y="376" width="290" height="62" rx="12" fill="#fb923c" fill-opacity=".12" stroke="#fb923c" stroke-opacity=".9" stroke-width="1.5"/><rect x="74" y="375.25" width="262" height="3" rx="1.5" fill="#fb923c"/><text x="205.0" y="403.9" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/var/lib</text><text x="205.0" y="422.1" font-size="12" fill="#94a3b8" text-anchor="middle">persistent state</text></g><g class="pop" style="animation-delay:0.80s"><rect x="550" y="376" width="290" height="62" rx="12" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".9" stroke-width="1.5"/><rect x="564" y="375.25" width="262" height="3" rx="1.5" fill="#f472b6"/><text x="695.0" y="403.9" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/run</text><text x="695.0" y="422.1" font-size="12" fill="#94a3b8" text-anchor="middle">live runtime</text></g><path d="M400,306 C400,345 205,335 205,374" fill="none" stroke="#fb923c" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-orange)"/><circle r="4.5" fill="#fb923c" filter="url(#glow)"><animateMotion dur="2.6s" begin="0.5s" repeatCount="indefinite" path="M400,306 C400,345 205,335 205,374"/></circle><path d="M500,306 C500,345 695,335 695,374" fill="none" stroke="#f472b6" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-pink)"/><circle r="4.5" fill="#f472b6" filter="url(#glow)"><animateMotion dur="2.6s" begin="0.5s" repeatCount="indefinite" path="M500,306 C500,345 695,335 695,374"/></circle><g class="pop" style="animation-delay:1.00s"><rect x="60" y="484" width="290" height="62" rx="12" fill="#fb923c" fill-opacity=".12" stroke="#fb923c" stroke-opacity=".9" stroke-width="1.5"/><rect x="74" y="483.25" width="262" height="3" rx="1.5" fill="#fb923c"/><text x="205.0" y="511.0" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/var/log · /var/spool</text><text x="205.0" y="528.6" font-size="12" fill="#94a3b8" text-anchor="middle">logs · queues</text></g><g class="pop" style="animation-delay:1.10s"><rect x="550" y="484" width="290" height="62" rx="12" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".9" stroke-width="1.5"/><rect x="564" y="483.25" width="262" height="3" rx="1.5" fill="#f472b6"/><text x="695.0" y="511.0" font-size="15" fill="#f8fafc" text-anchor="middle" font-weight="700">sockets · PID state</text><text x="695.0" y="528.6" font-size="12" fill="#94a3b8" text-anchor="middle">recreated every boot</text></g><path d="M205,440 V482" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-orange)"/><path d="M695,440 V482" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-pink)"/><text x="450" y="570" font-size="12" fill="#64748b" text-anchor="middle">Study aid, not a claim that every service uses exactly these paths.</text></g><rect x=".75" y=".75" width="898.5" height="578.5" rx="19.5" fill="none" stroke="#2b3566" stroke-width="1.5"/></svg>