<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="One unified Linux directory tree rooted at /"><title>One unified Linux directory tree rooted at /</title><defs>
  <style>
    @media (prefers-color-scheme: light) {
      /* Backgrounds & Cards */
      rect[fill="url(#bg)"], rect[fill="#0b0f1a"], rect[fill="#0d1117"], rect[fill="#0a0d14"], rect[fill="#0e1320"], rect[fill="#121826"] {
        fill: #f6f8fa !important;
      }
      linearGradient#bg stop:nth-child(1) { stop-color: #ffffff !important; }
      linearGradient#bg stop:nth-child(2) { stop-color: #f6f8fa !important; }
      linearGradient#bg stop:nth-child(3) { stop-color: #edf2f7 !important; }

      rect[fill="#161b22"], rect[fill="#151b28"], rect[fill="#1a2030"] {
        fill: #ffffff !important;
        stroke: #d0d7de !important;
      }
      rect[fill="#0d1117"], rect[fill="#101522"] { fill: #f6f8fa !important; }
      rect[stroke="#30363d"], line[stroke="#30363d"] { stroke: #d0d7de !important; }
      rect[stroke="#21262d"], line[stroke="#21262d"] { stroke: #d0d7de !important; }

      /* Typography */
      text[fill="#ffffff"], text[fill="#e6edf3"], text[fill="#f0f6fc"], text[fill="#f8fafc"] {
        fill: #1f2328 !important;
      }
      text[fill="#8b949e"], text[fill="#c9d1d9"], text[fill="#94a3b8"] {
        fill: #57606a !important;
      }
      text[fill="#7d8590"] { fill: #656d76 !important; }

      /* Shapes & Patterns */
      pattern circle { fill: #0969da !important; opacity: 0.07 !important; }
      circle[fill="#0d1117"], circle[fill="#161b22"], circle[fill="#0b0f1a"] { fill: #ffffff !important; }
    }
  </style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#171d42"/></linearGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern><clipPath id="clip"><rect width="900" height="400" rx="20"/></clipPath><marker id="arr-cyan" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#22d3ee"/></marker><marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#60a5fa"/></marker><marker id="arr-violet" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#a78bfa"/></marker><marker id="arr-pink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#f472b6"/></marker><marker id="arr-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fb923c"/></marker><marker id="arr-yellow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#facc15"/></marker><marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#4ade80"/></marker><marker id="arr-red" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#f87171"/></marker><marker id="arr-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#2dd4bf"/></marker><marker id="arr-slate" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#94a3b8"/></marker></defs><style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'DejaVu Sans Mono',monospace}
.flow{stroke-dasharray:7 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:float 4.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pop{animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style><rect width="900" height="400" rx="20" fill="url(#bg)"/><rect width="900" height="400" rx="20" fill="url(#dots)"/><g clip-path="url(#clip)"><g class="pop" style="animation-delay:0.00s"><rect x="340" y="28" width="220" height="68" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".9" stroke-width="1.5"/><rect x="354" y="27.25" width="192" height="3" rx="1.5" fill="#a78bfa"/><text x="450.0" y="63.1" font-size="32" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/</text><text x="450.0" y="84.1" font-size="12" fill="#94a3b8" text-anchor="middle">root of the entire namespace</text></g><path d="M450,96 C450,150 110,140 110,200" fill="none" stroke="#facc15" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-yellow)"/><circle r="4.5" fill="#facc15" filter="url(#glow)"><animateMotion dur="3s" begin="0.0s" repeatCount="indefinite" path="M450,96 C450,150 110,140 110,200"/></circle><g class="pop" style="animation-delay:0.20s"><rect x="32" y="200" width="156" height="112" rx="12" fill="#facc15" fill-opacity=".12" stroke="#facc15" stroke-opacity=".9" stroke-width="1.5"/><rect x="46" y="199.25" width="128" height="3" rx="1.5" fill="#facc15"/><text x="110.0" y="246.1" font-size="21" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/etc</text><text x="110.0" y="264.1" font-size="11" fill="#facc15" text-anchor="middle">CONFIG</text><text x="110.0" y="280.4" font-size="11.5" fill="#94a3b8" text-anchor="middle">system configuration</text></g><path d="M450,96 C450,150 280,140 280,200" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-green)"/><circle r="4.5" fill="#4ade80" filter="url(#glow)"><animateMotion dur="3s" begin="0.5s" repeatCount="indefinite" path="M450,96 C450,150 280,140 280,200"/></circle><g class="pop" style="animation-delay:0.32s"><rect x="202" y="200" width="156" height="112" rx="12" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-opacity=".9" stroke-width="1.5"/><rect x="216" y="199.25" width="128" height="3" rx="1.5" fill="#4ade80"/><text x="280.0" y="246.1" font-size="21" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/home</text><text x="280.0" y="264.1" font-size="11" fill="#4ade80" text-anchor="middle">USER DATA</text><text x="280.0" y="280.4" font-size="11.5" fill="#94a3b8" text-anchor="middle">personal files</text></g><path d="M450,96 C450,150 450,140 450,200" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-blue)"/><circle r="4.5" fill="#60a5fa" filter="url(#glow)"><animateMotion dur="3s" begin="1.0s" repeatCount="indefinite" path="M450,96 C450,150 450,140 450,200"/></circle><g class="pop" style="animation-delay:0.44s"><rect x="372" y="200" width="156" height="112" rx="12" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".9" stroke-width="1.5"/><rect x="386" y="199.25" width="128" height="3" rx="1.5" fill="#60a5fa"/><text x="450.0" y="246.1" font-size="21" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/usr</text><text x="450.0" y="264.1" font-size="11" fill="#60a5fa" text-anchor="middle">SOFTWARE</text><text x="450.0" y="280.4" font-size="11.5" fill="#94a3b8" text-anchor="middle">programs &amp; libraries</text></g><path d="M450,96 C450,150 620,140 620,200" fill="none" stroke="#fb923c" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-orange)"/><circle r="4.5" fill="#fb923c" filter="url(#glow)"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M450,96 C450,150 620,140 620,200"/></circle><g class="pop" style="animation-delay:0.56s"><rect x="542" y="200" width="156" height="112" rx="12" fill="#fb923c" fill-opacity=".12" stroke="#fb923c" stroke-opacity=".9" stroke-width="1.5"/><rect x="556" y="199.25" width="128" height="3" rx="1.5" fill="#fb923c"/><text x="620.0" y="246.1" font-size="21" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/var</text><text x="620.0" y="264.1" font-size="11" fill="#fb923c" text-anchor="middle">VARIABLE</text><text x="620.0" y="280.4" font-size="11.5" fill="#94a3b8" text-anchor="middle">logs · caches · state</text></g><path d="M450,96 C450,150 790,140 790,200" fill="none" stroke="#f87171" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-red)"/><circle r="4.5" fill="#f87171" filter="url(#glow)"><animateMotion dur="3s" begin="2.0s" repeatCount="indefinite" path="M450,96 C450,150 790,140 790,200"/></circle><g class="pop" style="animation-delay:0.68s"><rect x="712" y="200" width="156" height="112" rx="12" fill="#f87171" fill-opacity=".12" stroke="#f87171" stroke-opacity=".9" stroke-width="1.5"/><rect x="726" y="199.25" width="128" height="3" rx="1.5" fill="#f87171"/><text x="790.0" y="246.1" font-size="21" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/boot</text><text x="790.0" y="264.1" font-size="11" fill="#f87171" text-anchor="middle">BOOT</text><text x="790.0" y="280.4" font-size="11.5" fill="#94a3b8" text-anchor="middle">kernel · initramfs</text></g><rect x="130" y="344" width="640" height="40" rx="20" fill="#94a3b8" fill-opacity=".1" stroke="#94a3b8" stroke-opacity=".4"/><text x="450" y="369" font-size="15" fill="#cbd5e1" text-anchor="middle">No C:\ or D:\ — every filesystem is mounted somewhere under /</text></g><rect x=".75" y=".75" width="898.5" height="398.5" rx="19.5" fill="none" stroke="#2b3566" stroke-width="1.5"/></svg>