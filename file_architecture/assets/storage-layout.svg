<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-label="Example NVMe disk layout and mount points"><title>Example NVMe disk layout and mount points</title><defs>
  <style>
    @media (prefers-color-scheme: light) {
      /* Backgrounds & Cards */
      rect[fill="url(#bg)"], rect[fill="#0b0f1a"], rect[fill="#0d1117"], rect[fill="#0a0d14"], rect[fill="#0e1320"], rect[fill="#121826"] {
        fill: #f6f8fa !important;
      }
      linearGradient#bg stop:nth-child(1) { stop-color: #ffffff !important; }
      linearGradient#bg stop:nth-child(2) { stop-color: #f6f8fa !important; }
      linearGradient#bg stop:nth-child(3) { stop-color: #edf2f7 !important; }

      rect[fill="#161b22"], rect[fill="#151b28"], rect[fill="#1a2030"] {
        fill: #ffffff !important;
        stroke: #d0d7de !important;
      }
      rect[fill="#0d1117"], rect[fill="#101522"] { fill: #f6f8fa !important; }
      rect[stroke="#30363d"], line[stroke="#30363d"] { stroke: #d0d7de !important; }
      rect[stroke="#21262d"], line[stroke="#21262d"] { stroke: #d0d7de !important; }

      /* Typography */
      text[fill="#ffffff"], text[fill="#e6edf3"], text[fill="#f0f6fc"], text[fill="#f8fafc"] {
        fill: #1f2328 !important;
      }
      text[fill="#8b949e"], text[fill="#c9d1d9"], text[fill="#94a3b8"] {
        fill: #57606a !important;
      }
      text[fill="#7d8590"] { fill: #656d76 !important; }

      /* Shapes & Patterns */
      pattern circle { fill: #0969da !important; opacity: 0.07 !important; }
      circle[fill="#0d1117"], circle[fill="#161b22"], circle[fill="#0b0f1a"] { fill: #ffffff !important; }
    }
  </style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#171d42"/></linearGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern><clipPath id="clip"><rect width="900" height="410" rx="20"/></clipPath><marker id="arr-cyan" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#22d3ee"/></marker><marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#60a5fa"/></marker><marker id="arr-violet" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#a78bfa"/></marker><marker id="arr-pink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#f472b6"/></marker><marker id="arr-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fb923c"/></marker><marker id="arr-yellow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#facc15"/></marker><marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#4ade80"/></marker><marker id="arr-red" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#f87171"/></marker><marker id="arr-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#2dd4bf"/></marker><marker id="arr-slate" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#94a3b8"/></marker></defs><style>
text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'DejaVu Sans Mono',monospace}
.flow{stroke-dasharray:7 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:float 4.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pop{animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style><rect width="900" height="410" rx="20" fill="url(#bg)"/><rect width="900" height="410" rx="20" fill="url(#dots)"/><g clip-path="url(#clip)"><text x="450" y="40" font-size="15" fill="#cbd5e1" text-anchor="middle" font-weight="700" class="m">Physical NVMe SSD  ·  /dev/nvme0n1</text><g class="pop" style="animation-delay:0.00s"><rect x="40" y="60" width="170" height="88" rx="12" fill="#f87171" fill-opacity=".12" stroke="#f87171" stroke-opacity=".9" stroke-width="1.5"/><rect x="54" y="59.25" width="142" height="3" rx="1.5" fill="#f87171"/><text x="125.0" y="100.3" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">nvme0n1p1</text><text x="125.0" y="118.1" font-size="12" fill="#94a3b8" text-anchor="middle">EFI System Partition (FAT)</text></g><path d="M125.0,150 V212" fill="none" stroke="#f87171" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-red)"/><circle r="4.5" fill="#f87171" filter="url(#glow)"><animateMotion dur="2s" begin="0.0s" repeatCount="indefinite" path="M125.0,150 V212"/></circle><g class="pop" style="animation-delay:0.40s"><rect x="40" y="214" width="170" height="66" rx="12" fill="#f87171" fill-opacity=".12" stroke="#f87171" stroke-opacity=".9" stroke-width="1.5"/><rect x="54" y="213.25" width="142" height="3" rx="1.5" fill="#f87171"/><text x="125.0" y="243.9" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/boot/efi</text><text x="125.0" y="262.1" font-size="12" fill="#94a3b8" text-anchor="middle">mounted here · boot files</text></g><g class="pop" style="animation-delay:0.20s"><rect x="216" y="60" width="450" height="88" rx="12" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".9" stroke-width="1.5"/><rect x="230" y="59.25" width="422" height="3" rx="1.5" fill="#60a5fa"/><text x="441.0" y="100.3" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">nvme0n1p2</text><text x="441.0" y="118.1" font-size="12" fill="#94a3b8" text-anchor="middle">Linux filesystem</text></g><path d="M441.0,150 V212" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-blue)"/><circle r="4.5" fill="#60a5fa" filter="url(#glow)"><animateMotion dur="2s" begin="0.5s" repeatCount="indefinite" path="M441.0,150 V212"/></circle><g class="pop" style="animation-delay:0.60s"><rect x="216" y="214" width="450" height="66" rx="12" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".9" stroke-width="1.5"/><rect x="230" y="213.25" width="422" height="3" rx="1.5" fill="#60a5fa"/><text x="441.0" y="243.9" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">/</text><text x="441.0" y="262.1" font-size="12" fill="#94a3b8" text-anchor="middle">mounted here · root filesystem</text></g><g class="pop" style="animation-delay:0.40s"><rect x="672" y="60" width="188" height="88" rx="12" fill="#fb923c" fill-opacity=".12" stroke="#fb923c" stroke-opacity=".9" stroke-width="1.5"/><rect x="686" y="59.25" width="160" height="3" rx="1.5" fill="#fb923c"/><text x="766.0" y="100.3" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">nvme0n1p3</text><text x="766.0" y="118.1" font-size="12" fill="#94a3b8" text-anchor="middle">swap or data (optional)</text></g><path d="M766.0,150 V212" fill="none" stroke="#fb923c" stroke-width="2.2" stroke-linecap="round" opacity="0.9" class="flow" marker-end="url(#arr-orange)"/><circle r="4.5" fill="#fb923c" filter="url(#glow)"><animateMotion dur="2s" begin="1.0s" repeatCount="indefinite" path="M766.0,150 V212"/></circle><g class="pop" style="animation-delay:0.80s"><rect x="672" y="214" width="188" height="66" rx="12" fill="#fb923c" fill-opacity=".12" stroke="#fb923c" stroke-opacity=".9" stroke-width="1.5"/><rect x="686" y="213.25" width="160" height="3" rx="1.5" fill="#fb923c"/><text x="766.0" y="243.9" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="700" class="m">swap / data</text><text x="766.0" y="262.1" font-size="12" fill="#94a3b8" text-anchor="middle">optional</text></g><text x="450" y="326" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="700" letter-spacing="2">Systems may also use</text><g class="pop" style="animation-delay:1.00s"><rect x="48" y="342" width="50" height="30" rx="15.0" fill="#2dd4bf" fill-opacity=".16" stroke="#2dd4bf" stroke-opacity=".8" stroke-width="1.2"/><text x="73.0" y="361.2" font-size="12" fill="#f1f5f9" text-anchor="middle" font-weight="700">LVM</text></g><g class="pop" style="animation-delay:1.00s"><rect x="108" y="342" width="139" height="30" rx="15.0" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-opacity=".8" stroke-width="1.2"/><text x="177.5" y="361.2" font-size="12" fill="#f1f5f9" text-anchor="middle" font-weight="700">LUKS encryption</text></g><g class="pop" style="animation-delay:1.00s"><rect x="258" y="342" width="147" height="30" rx="15.0" fill="#f472b6" fill-opacity=".16" stroke="#f472b6" stroke-opacity=".8" stroke-width="1.2"/><text x="331.5" y="361.2" font-size="12" fill="#f1f5f9" text-anchor="middle" font-weight="700">Btrfs subvolumes</text></g><g class="pop" style="animation-delay:1.00s"><rect x="414" y="342" width="124" height="30" rx="15.0" fill="#22d3ee" fill-opacity=".16" stroke="#22d3ee" stroke-opacity=".8" stroke-width="1.2"/><text x="476.0" y="361.2" font-size="12" fill="#f1f5f9" text-anchor="middle" font-weight="700">software RAID</text></g><g class="pop" style="animation-delay:1.00s"><rect x="548" y="342" width="132" height="30" rx="15.0" fill="#4ade80" fill-opacity=".16" stroke="#4ade80" stroke-opacity=".8" stroke-width="1.2"/><text x="614.0" y="361.2" font-size="12" fill="#f1f5f9" text-anchor="middle" font-weight="700">separate /home</text></g><g class="pop" style="animation-delay:1.00s"><rect x="690" y="342" width="161" height="30" rx="15.0" fill="#facc15" fill-opacity=".16" stroke="#facc15" stroke-opacity=".8" stroke-width="1.2"/><text x="770.5" y="361.2" font-size="12" fill="#f1f5f9" text-anchor="middle" font-weight="700">other boot layouts</text></g><text x="450" y="396" font-size="11.5" fill="#64748b" text-anchor="middle">Example layout only.</text></g><rect x=".75" y=".75" width="898.5" height="408.5" rx="19.5" fill="none" stroke="#2b3566" stroke-width="1.5"/></svg>