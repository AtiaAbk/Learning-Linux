="#94a3b8" text-anchor="middle">one common interface for every filesystem</text></g><path d="M120,438.0 H170" stroke="#f472b6" stroke-width="2" opacity=".7"/><circle cx="120" cy="438.0" r="6" fill="#f472b6" filter="url(#glow)"/><g class="pop" style="animation-delay:0.45s"><rect x="170" y="388" width="500" height="100" rx="12" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".9" stroke-width="1.5"/><rect x="184" y="387.25" width="472" height="3" rx="1.5" fill="#f472b6"/><text x="420.0" y="415.6" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700">Filesystem driver</text><text x="420.0" y="433.6" font-size="12" fill="#94a3b8" text-anchor="middle">a concrete implementation</text></g><path d="M120,551.0 H170" stroke="#fb923c" stroke-width="2" opacity=".7"/><circle cx="120" cy="551.0" r="6" fill="#fb923c" filter="url(#glow)"/><g class="pop" style="animation-delay:0.60s"><rect x="170" y="522" width="500" height="58" rx="12" fill="#fb923c" fill-opacity=".12" stroke="#fb923c" stroke-opacity=".9" stroke-width="1.5"/><rect x="184" y="521.25" width="472" height="3" rx="1.5" fill="#fb923c"/><text x="420.0" y="547.6" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700">Block layer / device driver</text><text x="420.0" y="565.6" font-size="12" fill="#94a3b8" text-anchor="middle">(if block storage is involved)</text></g><path d="M120,649.0 H170" stroke="#4ade80" stroke-width="2" opacity=".7"/><circle cx="120" cy="649.0" r="6" fill="#4ade80" filter="url(#glow)"/><g class="pop" style="animation-delay:0.75s"><rect x="170" y="614" width="500" height="70" rx="12" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-opacity=".9" stroke-width="1.5"/><rect x="184" y="613.25" width="472" height="3" rx="1.5" fill="#4ade80"/><text x="420.0" y="645.6" font-size="17" fill="#f8fafc" text-anchor="middle" font-weight="700">Storage device</text><text x="420.0" y="663.6" font-size="12" fill="#94a3b8" text-anchor="middle">SSD · HDD · NVMe · net