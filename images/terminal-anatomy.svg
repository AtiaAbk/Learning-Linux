<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Anatomy of the terminal prompt and a command" xmlns:c2pa="http://c2pa.org/manifest"><defs>
  <style>
    @media (prefers-color-scheme: light) {
      /* Backgrounds & Cards */
      rect[fill="url(#bg)"], rect[fill="#0b0f1a"], rect[fill="#0d1117"], rect[fill="#0a0d14"], rect[fill="#0e1320"], rect[fill="#121826"] {
        fill: #f6f8fa !important;
      }
      linearGradient#bg stop:nth-child(1) { stop-color: #ffffff !important; }
      linearGradient#bg stop:nth-child(2) { stop-color: #f6f8fa !important; }
      linearGradient#bg stop:nth-child(3) { stop-color: #edf2f7 !important; }

      rect[fill="#161b22"], rect[fill="#151b28"], rect[fill="#1a2030"] {
        fill: #ffffff !important;
        stroke: #d0d7de !important;
      }
      rect[fill="#0d1117"], rect[fill="#101522"] { fill: #f6f8fa !important; }
      rect[stroke="#30363d"], line[stroke="#30363d"] { stroke: #d0d7de !important; }
      rect[stroke="#21262d"], line[stroke="#21262d"] { stroke: #d0d7de !important; }

      /* Typography */
      text[fill="#ffffff"], text[fill="#e6edf3"], text[fill="#f0f6fc"], text[fill="#f8fafc"] {
        fill: #1f2328 !important;
      }
      text[fill="#8b949e"], text[fill="#c9d1d9"], text[fill="#94a3b8"] {
        fill: #57606a !important;
      }
      text[fill="#7d8590"] { fill: #656d76 !important; }

      /* Shapes & Patterns */
      pattern circle { fill: #0969da !important; opacity: 0.07 !important; }
      circle[fill="#0d1117"], circle[fill="#161b22"], circle[fill="#0b0f1a"] { fill: #ffffff !important; }
    }
  </style>
</defs>
<title>Anatomy of the terminal prompt and a command</title>
<rect width="900" height="350" rx="18" fill="#0d1117"/>
<text x="450" y="38" text-anchor="middle" fill="#e6edf3" font-size="21" font-weight="700" >Anatomy of the Terminal</text>
<text x="60" y="76" text-anchor="start" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">THE PROMPT</text>
<text x="60" y="122" fill="#3fb950" font-size="28" font-weight="700" font-family="SFMono-Regular, Consolas, Menlo, monospace" textLength="68" lengthAdjust="spacingAndGlyphs">atia</text><rect x="60" y="134" width="68" height="5" rx="2" fill="#3fb950"><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="0.0s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="0.0s" repeatCount="indefinite"/><text x="94.0" y="166" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700" >username</text></g>
<text x="128" y="122" fill="#8b949e" font-size="28" font-weight="700" font-family="SFMono-Regular, Consolas, Menlo, monospace" textLength="17" lengthAdjust="spacingAndGlyphs">@</text><rect x="128" y="134" width="17" height="5" rx="2" fill="#8b949e"><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="0.7s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="0.7s" repeatCount="indefinite"/><text x="136.5" y="166" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="700" ></text></g>
<text x="145" y="122" fill="#58a6ff" font-size="28" font-weight="700" font-family="SFMono-Regular, Consolas, Menlo, monospace" textLength="102" lengthAdjust="spacingAndGlyphs">ubuntu</text><rect x="145" y="134" width="102" height="5" rx="2" fill="#58a6ff"><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="1.4s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="1.4s" repeatCount="indefinite"/><text x="196.0" y="166" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="700" >hostname</text></g>
<text x="247" y="122" fill="#8b949e" font-size="28" font-weight="700" font-family="SFMono-Regular, Consolas, Menlo, monospace" textLength="17" lengthAdjust="spacingAndGlyphs">:</text><rect x="247" y="134" width="17" height="5" rx="2" fill="#8b949e"><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="2.0999999999999996s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="2.0999999999999996s" repeatCount="indefinite"/><text x="255.5" y="166" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="700" ></text></g>
<text x="264" y="122" fill="#d29922" font-size="28" font-weight="700" font-family="SFMono-Regular, Consolas, Menlo, monospace" textLength="170" lengthAdjust="spacingAndGlyphs">~/projects</text><rect x="264" y="134" width="170" height="5" rx="2" fill="#d29922"><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="2.8s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="2.8s" repeatCount="indefinite"/><text x="349.0" y="166" text-anchor="middle" fill="#d29922" font-size="13" font-weight="700" >current directory</text></g>
<text x="434" y="122" fill="#f778ba" font-size="28" font-weight="700" font-family="SFMono-Regular, Consolas, Menlo, monospace" textLength="17" lengthAdjust="spacingAndGlyphs">$</text><rect x="434" y="134" width="17" height="5" rx="2" fill="#f778ba"><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="3.5s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="3.5s" repeatCount="indefinite"/><text x="442.5" y="166" text-anchor="middle" fill="#f778ba" font-size="13" font-weight="700" >prompt</text></g>
<text x="520" y="108" text-anchor="start" fill="#8b949e" font-size="13" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >~    your home directory</text>
<text x="520" y="130" text-anchor="start" fill="#8b949e" font-size="13" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >$    normal user</text>
<text x="520" y="152" text-anchor="start" fill="#8b949e" font-size="13" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >#    root (administrator)</text>
<line x1="60" y1="190" x2="840" y2="190" stroke="#30363d" stroke-width="1"/>
<text x="60" y="220" text-anchor="start" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">A COMMAND</text>
<text x="60" y="268" fill="#3fb950" font-size="28" font-weight="700" font-family="SFMono-Regular, Consolas, Menlo, monospace" textLength="34" lengthAdjust="spacingAndGlyphs">ls</text><rect x="60" y="280" width="34" height="5" rx="2" fill="#3fb950"><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="0.0s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="0.0s" repeatCount="indefinite"/><text x="77.0" y="312" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700" >command</text></g>
<text x="94" y="268" fill="#8b949e" font-size="28" font-weight="700" font-family="SFMono-Regular, Consolas, Menlo, monospace" textLength="17" lengthAdjust="spacingAndGlyphs"> </text><rect x="94" y="280" width="17" height="5" rx="2" fill="#8b949e"><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="0.7s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="0.7s" repeatCount="indefinite"/><text x="102.5" y="312" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="700" ></text></g>
<text x="111" y="268" fill="#d29922" font-size="28" font-weight="700" font-family="SFMono-Regular, Consolas, Menlo, monospace" textLength="68" lengthAdjust="spacingAndGlyphs">-lah</text><rect x="111" y="280" width="68" height="5" rx="2" fill="#d29922"><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="1.4s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="1.4s" repeatCount="indefinite"/><text x="145.0" y="312" text-anchor="middle" fill="#d29922" font-size="13" font-weight="700" >option</text></g>
<text x="179" y="268" fill="#8b949e" font-size="28" font-weight="700" font-family="SFMono-Regular, Consolas, Menlo, monospace" textLength="17" lengthAdjust="spacingAndGlyphs"> </text><rect x="179" y="280" width="17" height="5" rx="2" fill="#8b949e"><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="2.0999999999999996s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="2.0999999999999996s" repeatCount="indefinite"/><text x="187.5" y="312" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="700" ></text></g>
<text x="196" y="268" fill="#58a6ff" font-size="28" font-weight="700" font-family="SFMono-Regular, Consolas, Menlo, monospace" textLength="136" lengthAdjust="spacingAndGlyphs">/var/log</text><rect x="196" y="280" width="136" height="5" rx="2" fill="#58a6ff"><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="2.8s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" begin="2.8s" repeatCount="indefinite"/><text x="264.0" y="312" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="700" >argument</text></g>
<text x="520" y="246" text-anchor="start" fill="#8b949e" font-size="13" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" xml:space="preserve">ls       list directory contents</text>
<text x="520" y="266" text-anchor="start" fill="#8b949e" font-size="13" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" xml:space="preserve">-l       long format</text>
<text x="520" y="286" text-anchor="start" fill="#8b949e" font-size="13" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" xml:space="preserve">-a       show hidden files</text>
<text x="520" y="306" text-anchor="start" fill="#8b949e" font-size="13" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" xml:space="preserve">-h       human-readable sizes</text>
<text x="520" y="326" text-anchor="start" fill="#8b949e" font-size="13" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" xml:space="preserve">/var/log where to look</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
