<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 312" width="800" height="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs>
  <style>
    @media (prefers-color-scheme: light) {
      /* Backgrounds & Cards */
      rect[fill="url(#bg)"], rect[fill="#0b0f1a"], rect[fill="#0d1117"], rect[fill="#0a0d14"], rect[fill="#0e1320"], rect[fill="#121826"] {
        fill: #f6f8fa !important;
      }
      linearGradient#bg stop:nth-child(1) { stop-color: #ffffff !important; }
      linearGradient#bg stop:nth-child(2) { stop-color: #f6f8fa !important; }
      linearGradient#bg stop:nth-child(3) { stop-color: #edf2f7 !important; }

      rect[fill="#161b22"], rect[fill="#151b28"], rect[fill="#1a2030"] {
        fill: #ffffff !important;
        stroke: #d0d7de !important;
      }
      rect[fill="#0d1117"], rect[fill="#101522"] { fill: #f6f8fa !important; }
      rect[stroke="#30363d"], line[stroke="#30363d"] { stroke: #d0d7de !important; }
      rect[stroke="#21262d"], line[stroke="#21262d"] { stroke: #d0d7de !important; }

      /* Typography */
      text[fill="#ffffff"], text[fill="#e6edf3"], text[fill="#f0f6fc"], text[fill="#f8fafc"] {
        fill: #1f2328 !important;
      }
      text[fill="#8b949e"], text[fill="#c9d1d9"], text[fill="#94a3b8"] {
        fill: #57606a !important;
      }
      text[fill="#7d8590"] { fill: #656d76 !important; }

      /* Shapes & Patterns */
      pattern circle { fill: #0969da !important; opacity: 0.07 !important; }
      circle[fill="#0d1117"], circle[fill="#161b22"], circle[fill="#0b0f1a"] { fill: #ffffff !important; }
    }
  </style>
</defs>
<rect width="800" height="312" rx="16" fill="#0d1117"/>
<text x="400" y="36" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">How a Command Travels</text>
<rect x="30" y="70" width="140" height="80" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="100" y="105" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >User</text>
<text x="100" y="128" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >types a command</text>
<line x1="172" y1="110" x2="231" y2="110" stroke="#30363d" stroke-width="3" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" values="0;-10" dur="0.7s" repeatCount="indefinite"/></line>
<rect x="233" y="70" width="140" height="80" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="303" y="105" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >Terminal</text>
<text x="303" y="128" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >shows the text</text>
<line x1="375" y1="110" x2="434" y2="110" stroke="#30363d" stroke-width="3" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" values="0;-10" dur="0.7s" repeatCount="indefinite"/></line>
<rect x="436" y="70" width="140" height="80" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/>
<text x="506" y="105" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >Shell</text>
<text x="506" y="128" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >Bash / Zsh / Fish</text>
<line x1="578" y1="110" x2="637" y2="110" stroke="#30363d" stroke-width="3" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" values="0;-10" dur="0.7s" repeatCount="indefinite"/></line>
<rect x="639" y="70" width="140" height="80" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
<text x="709" y="105" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >Operating System</text>
<text x="709" y="128" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >kernel runs it</text>
<line x1="100" y1="205" x2="710" y2="205" stroke="#30363d" stroke-width="2"/>
<line x1="100" y1="250" x2="710" y2="250" stroke="#30363d" stroke-width="2"/>
<text x="30" y="209" text-anchor="start" fill="#58a6ff" font-size="12" font-weight="400" >in</text>
<text x="30" y="254" text-anchor="start" fill="#3fb950" font-size="12" font-weight="400" >out</text>
<g><rect x="-48" y="-14" width="96" height="28" rx="14" fill="#58a6ff"/><text x="0" y="5" text-anchor="middle" fill="#0d1117" font-size="13" font-weight="700" font-family="SFMono-Regular, Consolas, Menlo, monospace">ls -l</text><animateMotion dur="8s" repeatCount="indefinite" path="M100,205 L710,205" keyPoints="0;1;1" keyTimes="0;0.45;1" calcMode="linear"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="8s" repeatCount="indefinite"/></g>
<g><rect x="-48" y="-14" width="96" height="28" rx="14" fill="#3fb950"/><text x="0" y="5" text-anchor="middle" fill="#0d1117" font-size="13" font-weight="700" font-family="SFMono-Regular, Consolas, Menlo, monospace">output</text><animateMotion dur="8s" repeatCount="indefinite" path="M710,250 L100,250" keyPoints="0;0;1;1" keyTimes="0;0.5;0.95;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.49;0.5;1" dur="8s" repeatCount="indefinite"/></g>
<text x="400" y="292" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >The command goes down to the OS, and the result comes back up</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
