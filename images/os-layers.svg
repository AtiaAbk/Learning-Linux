<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="What is an operating system: the layers" xmlns:c2pa="http://c2pa.org/manifest"><defs>
  <style>
    @media (prefers-color-scheme: light) {
      /* Backgrounds & Cards */
      rect[fill="url(#bg)"], rect[fill="#0b0f1a"], rect[fill="#0d1117"], rect[fill="#0a0d14"], rect[fill="#0e1320"], rect[fill="#121826"] {
        fill: #f6f8fa !important;
      }
      linearGradient#bg stop:nth-child(1) { stop-color: #ffffff !important; }
      linearGradient#bg stop:nth-child(2) { stop-color: #f6f8fa !important; }
      linearGradient#bg stop:nth-child(3) { stop-color: #edf2f7 !important; }

      rect[fill="#161b22"], rect[fill="#151b28"], rect[fill="#1a2030"] {
        fill: #ffffff !important;
        stroke: #d0d7de !important;
      }
      rect[fill="#0d1117"], rect[fill="#101522"] { fill: #f6f8fa !important; }
      rect[stroke="#30363d"], line[stroke="#30363d"] { stroke: #d0d7de !important; }
      rect[stroke="#21262d"], line[stroke="#21262d"] { stroke: #d0d7de !important; }

      /* Typography */
      text[fill="#ffffff"], text[fill="#e6edf3"], text[fill="#f0f6fc"], text[fill="#f8fafc"] {
        fill: #1f2328 !important;
      }
      text[fill="#8b949e"], text[fill="#c9d1d9"], text[fill="#94a3b8"] {
        fill: #57606a !important;
      }
      text[fill="#7d8590"] { fill: #656d76 !important; }

      /* Shapes & Patterns */
      pattern circle { fill: #0969da !important; opacity: 0.07 !important; }
      circle[fill="#0d1117"], circle[fill="#161b22"], circle[fill="#0b0f1a"] { fill: #ffffff !important; }
    }
  </style>
</defs>
<title>What is an operating system: the layers</title>
<rect width="820" height="480" rx="18" fill="#0d1117"/>
<text x="410" y="38" text-anchor="middle" fill="#e6edf3" font-size="21" font-weight="700" >Inside an Operating System</text>
<rect x="40" y="64" width="520" height="52" rx="10" fill="#161b22" stroke="#f778ba" stroke-width="2"></rect>
<rect x="40" y="64" width="9" height="52" rx="4" fill="#f778ba"/>
<text x="66" y="87" text-anchor="start" fill="#e6edf3" font-size="16" font-weight="700" >You (the user)</text>
<text x="66" y="106" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >types commands, clicks icons</text>
<rect x="40" y="126" width="520" height="52" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"></rect>
<rect x="40" y="126" width="9" height="52" rx="4" fill="#58a6ff"/>
<text x="66" y="149" text-anchor="start" fill="#e6edf3" font-size="16" font-weight="700" >Applications</text>
<text x="66" y="168" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Browser · Editor · Games · Terminal</text>
<rect x="40" y="188" width="520" height="52" rx="10" fill="#161b22" stroke="#39c5cf" stroke-width="2"></rect>
<rect x="40" y="188" width="9" height="52" rx="4" fill="#39c5cf"/>
<text x="66" y="211" text-anchor="start" fill="#e6edf3" font-size="16" font-weight="700" >Shell and utilities</text>
<text x="66" y="230" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >bash · ls · grep · systemctl</text>
<rect x="40" y="250" width="520" height="52" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"></rect>
<rect x="40" y="250" width="9" height="52" rx="4" fill="#d29922"/>
<text x="66" y="273" text-anchor="start" fill="#e6edf3" font-size="16" font-weight="700" >Libraries</text>
<text x="66" y="292" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >glibc · OpenSSL · GTK</text>
<rect x="40" y="312" width="520" height="52" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="3"><animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" begin="0s" repeatCount="indefinite"/></rect>
<rect x="40" y="312" width="9" height="52" rx="4" fill="#bc8cff"/>
<text x="66" y="335" text-anchor="start" fill="#e6edf3" font-size="16" font-weight="700" >KERNEL</text>
<text x="66" y="354" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >processes · memory · devices · files · networking</text>
<rect x="40" y="374" width="520" height="52" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"></rect>
<rect x="40" y="374" width="9" height="52" rx="4" fill="#3fb950"/>
<text x="66" y="397" text-anchor="start" fill="#e6edf3" font-size="16" font-weight="700" >Hardware</text>
<text x="66" y="416" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >CPU · RAM · disk · network card · GPU</text>
<path d="M578,126 L590,126 L590,302 L578,302" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/><text x="608" y="206" text-anchor="start" fill="#58a6ff" font-size="15" font-weight="800" >USER SPACE</text><text x="608" y="224" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >normal privileges</text><text x="608" y="240" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >apps cannot touch hardware</text>
<path d="M578,312 L590,312 L590,364 L578,364" fill="none" stroke="#bc8cff" stroke-width="3" stroke-linecap="round"/><text x="608" y="330" text-anchor="start" fill="#bc8cff" font-size="15" font-weight="800" >KERNEL SPACE</text><text x="608" y="348" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >full privileges</text><text x="608" y="364" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" ></text>
<path d="M578,374 L590,374 L590,426 L578,426" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/><text x="608" y="392" text-anchor="start" fill="#3fb950" font-size="15" font-weight="800" >PHYSICAL</text><text x="608" y="410" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >real machine</text><text x="608" y="426" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" ></text>
<circle r="8" fill="#d29922"><animateMotion dur="5s" repeatCount="indefinite" path="M300,90 L300,400 L300,90"/></circle>
<circle r="14" fill="#d29922" opacity="0.25"><animateMotion dur="5s" repeatCount="indefinite" path="M300,90 L300,400 L300,90"/></circle>
<text x="410" y="458" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="400" >A request travels down through the layers, the result climbs back up</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
