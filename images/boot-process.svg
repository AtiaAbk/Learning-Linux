<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" width="940" height="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Linux boot process" xmlns:c2pa="http://c2pa.org/manifest"><defs>
  <style>
    @media (prefers-color-scheme: light) {
      /* Backgrounds & Cards */
      rect[fill="url(#bg)"], rect[fill="#0b0f1a"], rect[fill="#0d1117"], rect[fill="#0a0d14"], rect[fill="#0e1320"], rect[fill="#121826"] {
        fill: #f6f8fa !important;
      }
      linearGradient#bg stop:nth-child(1) { stop-color: #ffffff !important; }
      linearGradient#bg stop:nth-child(2) { stop-color: #f6f8fa !important; }
      linearGradient#bg stop:nth-child(3) { stop-color: #edf2f7 !important; }

      rect[fill="#161b22"], rect[fill="#151b28"], rect[fill="#1a2030"] {
        fill: #ffffff !important;
        stroke: #d0d7de !important;
      }
      rect[fill="#0d1117"], rect[fill="#101522"] { fill: #f6f8fa !important; }
      rect[stroke="#30363d"], line[stroke="#30363d"] { stroke: #d0d7de !important; }
      rect[stroke="#21262d"], line[stroke="#21262d"] { stroke: #d0d7de !important; }

      /* Typography */
      text[fill="#ffffff"], text[fill="#e6edf3"], text[fill="#f0f6fc"], text[fill="#f8fafc"] {
        fill: #1f2328 !important;
      }
      text[fill="#8b949e"], text[fill="#c9d1d9"], text[fill="#94a3b8"] {
        fill: #57606a !important;
      }
      text[fill="#7d8590"] { fill: #656d76 !important; }

      /* Shapes & Patterns */
      pattern circle { fill: #0969da !important; opacity: 0.07 !important; }
      circle[fill="#0d1117"], circle[fill="#161b22"], circle[fill="#0b0f1a"] { fill: #ffffff !important; }
    }
  </style>
</defs>
<title>Linux boot process</title>
<rect width="940" height="310" rx="18" fill="#0d1117"/>
<text x="470" y="38" text-anchor="middle" fill="#e6edf3" font-size="21" font-weight="700" >What Happens When Linux Boots</text>
<rect x="22" y="86" width="112" height="96" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="fill" values="#1f6feb;#161b22" keyTimes="0;0.1429" calcMode="discrete" dur="9.1s" repeatCount="indefinite"/></rect>
<circle cx="42" cy="106" r="11" fill="#58a6ff"/><text x="42" y="110" text-anchor="middle" fill="#0d1117" font-size="12" font-weight="800" >1</text>
<text x="78" y="142" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >Firmware</text>
<text x="78" y="162" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >UEFI / BIOS</text>
<text x="78" y="208" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >POST</text>
<text x="140" y="140" text-anchor="middle" fill="#8b949e" font-size="24" font-weight="400" >›</text>
<rect x="146" y="86" width="112" height="96" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="fill" values="#161b22;#1f6feb;#161b22" keyTimes="0;0.1429;0.2857" calcMode="discrete" dur="9.1s" repeatCount="indefinite"/></rect>
<circle cx="166" cy="106" r="11" fill="#58a6ff"/><text x="166" y="110" text-anchor="middle" fill="#0d1117" font-size="12" font-weight="800" >2</text>
<text x="202" y="142" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >Bootloader</text>
<text x="202" y="162" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >GRUB</text>
<text x="202" y="208" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >/boot/grub</text>
<text x="264" y="140" text-anchor="middle" fill="#8b949e" font-size="24" font-weight="400" >›</text>
<rect x="270" y="86" width="112" height="96" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="fill" values="#161b22;#1f6feb;#161b22" keyTimes="0;0.2857;0.4286" calcMode="discrete" dur="9.1s" repeatCount="indefinite"/></rect>
<circle cx="290" cy="106" r="11" fill="#58a6ff"/><text x="290" y="110" text-anchor="middle" fill="#0d1117" font-size="12" font-weight="800" >3</text>
<text x="326" y="142" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >Kernel</text>
<text x="326" y="162" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >loads into RAM</text>
<text x="326" y="208" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >vmlinuz</text>
<text x="388" y="140" text-anchor="middle" fill="#8b949e" font-size="24" font-weight="400" >›</text>
<rect x="394" y="86" width="112" height="96" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="fill" values="#161b22;#1f6feb;#161b22" keyTimes="0;0.4286;0.5714" calcMode="discrete" dur="9.1s" repeatCount="indefinite"/></rect>
<circle cx="414" cy="106" r="11" fill="#58a6ff"/><text x="414" y="110" text-anchor="middle" fill="#0d1117" font-size="12" font-weight="800" >4</text>
<text x="450" y="142" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >initramfs</text>
<text x="450" y="162" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >temporary root</text>
<text x="450" y="208" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >initrd.img</text>
<text x="512" y="140" text-anchor="middle" fill="#8b949e" font-size="24" font-weight="400" >›</text>
<rect x="518" y="86" width="112" height="96" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="fill" values="#161b22;#1f6feb;#161b22" keyTimes="0;0.5714;0.7143" calcMode="discrete" dur="9.1s" repeatCount="indefinite"/></rect>
<circle cx="538" cy="106" r="11" fill="#58a6ff"/><text x="538" y="110" text-anchor="middle" fill="#0d1117" font-size="12" font-weight="800" >5</text>
<text x="574" y="142" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >systemd</text>
<text x="574" y="162" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >PID 1 starts</text>
<text x="574" y="208" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >systemctl</text>
<text x="636" y="140" text-anchor="middle" fill="#8b949e" font-size="24" font-weight="400" >›</text>
<rect x="642" y="86" width="112" height="96" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="fill" values="#161b22;#1f6feb;#161b22" keyTimes="0;0.7143;0.8571" calcMode="discrete" dur="9.1s" repeatCount="indefinite"/></rect>
<circle cx="662" cy="106" r="11" fill="#58a6ff"/><text x="662" y="110" text-anchor="middle" fill="#0d1117" font-size="12" font-weight="800" >6</text>
<text x="698" y="142" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >Targets</text>
<text x="698" y="162" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >services start</text>
<text x="698" y="208" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >multi-user</text>
<text x="760" y="140" text-anchor="middle" fill="#8b949e" font-size="24" font-weight="400" >›</text>
<rect x="766" y="86" width="112" height="96" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="fill" values="#161b22;#1f6feb" keyTimes="0;0.8571" calcMode="discrete" dur="9.1s" repeatCount="indefinite"/></rect>
<circle cx="786" cy="106" r="11" fill="#58a6ff"/><text x="786" y="110" text-anchor="middle" fill="#0d1117" font-size="12" font-weight="800" >7</text>
<text x="822" y="142" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >Login</text>
<text x="822" y="162" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >shell is ready</text>
<text x="822" y="208" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >bash / zsh</text>
<text x="470" y="258" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >Inspect your own boot:  systemd-analyze   ·   journalctl -b   ·   dmesg | head</text>
<text x="470" y="286" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >Power button to prompt, one step at a time</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
