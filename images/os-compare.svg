<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Linux vs Windows vs macOS" xmlns:c2pa="http://c2pa.org/manifest">
<title>Linux vs Windows vs macOS</title>
<rect width="1000" height="590" rx="18" fill="#0d1117"/>
<text x="500" y="38" text-anchor="middle" fill="#e6edf3" font-size="21" font-weight="700" >Linux  vs  Windows  vs  macOS</text>
<g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0333;0.0833;0.95;1" dur="12s" repeatCount="indefinite"/><rect x="30" y="70" width="300" height="470" rx="14" fill="#161b22" stroke="#f5c211" stroke-width="2"/><rect x="30" y="70" width="300" height="74" rx="14" fill="#f5c211" fill-opacity="0.18"/><text x="180" y="108" text-anchor="middle" fill="#f5c211" font-size="28" font-weight="800" >Linux</text><text x="180" y="130" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >Open, free, everywhere</text><line x1="46" y1="188" x2="314" y2="188" stroke="#30363d" stroke-width="1"/><text x="48" y="178" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Kernel</text><text x="312" y="178" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >Linux (monolithic)</text><line x1="46" y1="228" x2="314" y2="228" stroke="#30363d" stroke-width="1"/><text x="48" y="218" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >License</text><text x="312" y="218" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >GPLv2 · open source</text><line x1="46" y1="268" x2="314" y2="268" stroke="#30363d" stroke-width="1"/><text x="48" y="258" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Default shell</text><text x="312" y="258" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >Bash / Zsh</text><line x1="46" y1="308" x2="314" y2="308" stroke="#30363d" stroke-width="1"/><text x="48" y="298" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >File system</text><text x="312" y="298" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >ext4 · XFS · Btrfs</text><line x1="46" y1="348" x2="314" y2="348" stroke="#30363d" stroke-width="1"/><text x="48" y="338" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Package manager</text><text x="312" y="338" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >apt · dnf · pacman</text><line x1="46" y1="388" x2="314" y2="388" stroke="#30363d" stroke-width="1"/><text x="48" y="378" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Executables</text><text x="312" y="378" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >ELF</text><line x1="46" y1="428" x2="314" y2="428" stroke="#30363d" stroke-width="1"/><text x="48" y="418" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Home folder</text><text x="312" y="418" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >/home/name</text><line x1="46" y1="468" x2="314" y2="468" stroke="#30363d" stroke-width="1"/><text x="48" y="458" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Case-sensitive?</text><text x="312" y="458" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >Yes</text><line x1="46" y1="508" x2="314" y2="508" stroke="#30363d" stroke-width="1"/><text x="48" y="498" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Disk layout</text><text x="312" y="498" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >One root  /</text></g>
<g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0917;0.1417;0.95;1" dur="12s" repeatCount="indefinite"/><rect x="350" y="70" width="300" height="470" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><rect x="350" y="70" width="300" height="74" rx="14" fill="#58a6ff" fill-opacity="0.18"/><text x="500" y="108" text-anchor="middle" fill="#58a6ff" font-size="28" font-weight="800" >Windows</text><text x="500" y="130" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >Desktop and enterprise</text><line x1="366" y1="188" x2="634" y2="188" stroke="#30363d" stroke-width="1"/><text x="368" y="178" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Kernel</text><text x="632" y="178" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >NT (hybrid)</text><line x1="366" y1="228" x2="634" y2="228" stroke="#30363d" stroke-width="1"/><text x="368" y="218" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >License</text><text x="632" y="218" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >Proprietary</text><line x1="366" y1="268" x2="634" y2="268" stroke="#30363d" stroke-width="1"/><text x="368" y="258" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Default shell</text><text x="632" y="258" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >PowerShell · CMD</text><line x1="366" y1="308" x2="634" y2="308" stroke="#30363d" stroke-width="1"/><text x="368" y="298" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >File system</text><text x="632" y="298" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >NTFS · exFAT · ReFS</text><line x1="366" y1="348" x2="634" y2="348" stroke="#30363d" stroke-width="1"/><text x="368" y="338" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Package manager</text><text x="632" y="338" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >winget</text><line x1="366" y1="388" x2="634" y2="388" stroke="#30363d" stroke-width="1"/><text x="368" y="378" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Executables</text><text x="632" y="378" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >PE  (.exe)</text><line x1="366" y1="428" x2="634" y2="428" stroke="#30363d" stroke-width="1"/><text x="368" y="418" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Home folder</text><text x="632" y="418" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >C:\Users\name</text><line x1="366" y1="468" x2="634" y2="468" stroke="#30363d" stroke-width="1"/><text x="368" y="458" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Case-sensitive?</text><text x="632" y="458" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >No (case-preserving)</text><line x1="366" y1="508" x2="634" y2="508" stroke="#30363d" stroke-width="1"/><text x="368" y="498" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Disk layout</text><text x="632" y="498" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >Drive letters  C: D:</text></g>
<g><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1500;0.2000;0.95;1" dur="12s" repeatCount="indefinite"/><rect x="670" y="70" width="300" height="470" rx="14" fill="#161b22" stroke="#bc8cff" stroke-width="2"/><rect x="670" y="70" width="300" height="74" rx="14" fill="#bc8cff" fill-opacity="0.18"/><text x="820" y="108" text-anchor="middle" fill="#bc8cff" font-size="28" font-weight="800" >macOS</text><text x="820" y="130" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >UNIX polish, Apple-only</text><line x1="686" y1="188" x2="954" y2="188" stroke="#30363d" stroke-width="1"/><text x="688" y="178" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Kernel</text><text x="952" y="178" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >XNU (Mach + BSD)</text><line x1="686" y1="228" x2="954" y2="228" stroke="#30363d" stroke-width="1"/><text x="688" y="218" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >License</text><text x="952" y="218" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >Proprietary (Darwin open)</text><line x1="686" y1="268" x2="954" y2="268" stroke="#30363d" stroke-width="1"/><text x="688" y="258" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Default shell</text><text x="952" y="258" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >Zsh</text><line x1="686" y1="308" x2="954" y2="308" stroke="#30363d" stroke-width="1"/><text x="688" y="298" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >File system</text><text x="952" y="298" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >APFS</text><line x1="686" y1="348" x2="954" y2="348" stroke="#30363d" stroke-width="1"/><text x="688" y="338" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Package manager</text><text x="952" y="338" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >Homebrew (3rd party)</text><line x1="686" y1="388" x2="954" y2="388" stroke="#30363d" stroke-width="1"/><text x="688" y="378" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Executables</text><text x="952" y="378" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >Mach-O</text><line x1="686" y1="428" x2="954" y2="428" stroke="#30363d" stroke-width="1"/><text x="688" y="418" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Home folder</text><text x="952" y="418" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >/Users/name</text><line x1="686" y1="468" x2="954" y2="468" stroke="#30363d" stroke-width="1"/><text x="688" y="458" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Case-sensitive?</text><text x="952" y="458" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >No (APFS default)</text><line x1="686" y1="508" x2="954" y2="508" stroke="#30363d" stroke-width="1"/><text x="688" y="498" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" >Disk layout</text><text x="952" y="498" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="600" >One root  /</text></g>
<text x="500" y="568" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="400" >Different internals, same big ideas: files, processes, permissions, and a command line.</text>
