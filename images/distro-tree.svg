<text x="213.0" y="420.0" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >Ubuntu Server</text>
<rect x="545" y="396" width="250" height="38" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 4"/>
<text x="670" y="420" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="600" >RHEL  →  Rocky · AlmaLinux</text>
<text x="128" y="204" text-anchor="end" fill="#8b949e" font-size="12" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >apt · dpkg · .deb</text>
<text x="772" y="204" text-anchor="start" fill="#8b949e" font-size="12" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >dnf · rpm · .rpm</text>
<text x="762" y="324" text-anchor="start" fill="#8b949e" font-size="11" font-weight="400" >upstream of RHEL</text>
<text x="450" y="458" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="400" >Glowing boxes = the four distributions in this repository</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
