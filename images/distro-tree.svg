<path d="M135,342 L135,359 Q135,369 125,369 L87,369 Q77,369 77,379 L77,396" fill="none" stroke="#d29922" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-13" dur="0.9s" repeatCount="indefinite"/></path>
<path d="M135,342 L135,359 Q135,369 145,369 L203,369 Q213,369 213,379 L213,396" fill="none" stroke="#d29922" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-13" dur="0.9s" repeatCount="indefinite"/></path>
<path d="M670,342 L670,396" fill="none" stroke="#58a6ff" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-13" dur="0.9s" repeatCount="indefinite"/></path>
<rect x="350" y="66" width="200" height="46" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="2"></rect>
<text x="450.0" y="94.0" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >Linux Kernel</text>
