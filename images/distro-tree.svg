<text x="135.0" y="324.0" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >Ubuntu</text>
<rect x="260" y="296" width="150" height="46" rx="12" fill="#161b22" stroke="#557C94" stroke-width="3"><animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.2s" begin="0s" repeatCount="indefinite"/></rect>
<text x="335.0" y="324.0" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >Kali Linux</text>
<rect x="595" y="296" width="150" height="46" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="3"><animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.2s" begin="0s" repeatCount="indefinite"/></rect>
<text x="670.0" y="324.0" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700" >Fedora</text>
