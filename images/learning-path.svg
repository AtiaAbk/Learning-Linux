<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Four-stage Linux learning path" xmlns:c2pa="http://c2pa.org/manifest"><defs>
  <style>
    @media (prefers-color-scheme: light) {
      /* Backgrounds & Cards */
      rect[fill="url(#bg)"], rect[fill="#0b0f1a"], rect[fill="#0d1117"], rect[fill="#0a0d14"], rect[fill="#0e1320"], rect[fill="#121826"] {
        fill: #f6f8fa !important;
      }
      linearGradient#bg stop:nth-child(1) { stop-color: #ffffff !important; }
      linearGradient#bg stop:nth-child(2) { stop-color: #f6f8fa !important; }
      linearGradient#bg stop:nth-child(3) { stop-color: #edf2f7 !important; }

      rect[fill="#161b22"], rect[fill="#151b28"], rect[fill="#1a2030"] {
        fill: #ffffff !important;
        stroke: #d0d7de !important;
      }
      rect[fill="#0d1117"], rect[fill="#101522"] { fill: #f6f8fa !important; }
      rect[stroke="#30363d"], line[stroke="#30363d"] { stroke: #d0d7de !important; }
      rect[stroke="#21262d"], line[stroke="#21262d"] { stroke: #d0d7de !important; }

      /* Typography */
      text[fill="#ffffff"], text[fill="#e6edf3"], text[fill="#f0f6fc"], text[fill="#f8fafc"] {
        fill: #1f2328 !important;
      }
      text[fill="#8b949e"], text[fill="#c9d1d9"], text[fill="#94a3b8"] {
        fill: #57606a !important;
      }
      text[fill="#7d8590"] { fill: #656d76 !important; }

      /* Shapes & Patterns */
      pattern circle { fill: #0969da !important; opacity: 0.07 !important; }
      circle[fill="#0d1117"], circle[fill="#161b22"], circle[fill="#0b0f1a"] { fill: #ffffff !important; }
    }
  </style>
</defs>
<title>Four-stage Linux learning path</title>
<rect width="1000" height="330" rx="18" fill="#0d1117"/>
<text x="500" y="38" text-anchor="middle" fill="#e6edf3" font-size="21" font-weight="700" >Your Learning Path</text>
<rect x="125" y="107" width="750" height="6" rx="3" fill="#30363d"/>
<path d="M125,110 L875,110" fill="none" stroke="#58a6ff" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-13" dur="1.4s" repeatCount="indefinite"/></path>
<circle cx="125" cy="110" r="28" fill="#161b22" stroke="#E95420" stroke-width="4"><animate attributeName="fill" values="#E95420;#161b22" keyTimes="0;0.2500" calcMode="discrete" dur="12s" repeatCount="indefinite"/></circle>
<text x="125" y="120" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="800" >1</text>
<rect x="15" y="168" width="220" height="124" rx="14" fill="#161b22" stroke="#E95420" stroke-width="2"/>
<text x="125" y="196" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="800" >Foundations</text>
<text x="125" y="216" text-anchor="middle" fill="#E95420" font-size="13" font-weight="700" >Ubuntu Desktop</text>
<text x="125" y="246" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >navigation · files</text>
<text x="125" y="264" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >permissions · shell basics</text>
<circle cx="375" cy="110" r="28" fill="#161b22" stroke="#C7410F" stroke-width="4"><animate attributeName="fill" values="#161b22;#C7410F;#161b22" keyTimes="0;0.2500;0.5000" calcMode="discrete" dur="12s" repeatCount="indefinite"/></circle>
<text x="375" y="120" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="800" >2</text>
<rect x="265" y="168" width="220" height="124" rx="14" fill="#161b22" stroke="#C7410F" stroke-width="2"/>
<text x="375" y="196" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="800" >Server Skills</text>
<text x="375" y="216" text-anchor="middle" fill="#C7410F" font-size="13" font-weight="700" >Ubuntu Server</text>
<text x="375" y="246" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >headless admin over SSH</text>
<text x="375" y="264" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >services · logs · hosting</text>
<circle cx="625" cy="110" r="28" fill="#161b22" stroke="#557C94" stroke-width="4"><animate attributeName="fill" values="#161b22;#557C94;#161b22" keyTimes="0;0.5000;0.7500" calcMode="discrete" dur="12s" repeatCount="indefinite"/></circle>
<text x="625" y="120" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="800" >3</text>
<rect x="515" y="168" width="220" height="124" rx="14" fill="#161b22" stroke="#557C94" stroke-width="2"/>
<text x="625" y="196" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="800" >Security Awareness</text>
<text x="625" y="216" text-anchor="middle" fill="#557C94" font-size="13" font-weight="700" >Kali Linux</text>
<text x="625" y="246" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >terminal security tooling</text>
<text x="625" y="264" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >own lab only, ethical use</text>
<circle cx="875" cy="110" r="28" fill="#161b22" stroke="#3C6EB4" stroke-width="4"><animate attributeName="fill" values="#161b22;#3C6EB4" keyTimes="0;0.7500" calcMode="discrete" dur="12s" repeatCount="indefinite"/></circle>
<text x="875" y="120" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="800" >4</text>
<rect x="765" y="168" width="220" height="124" rx="14" fill="#161b22" stroke="#3C6EB4" stroke-width="2"/>
<text x="875" y="196" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="800" >Cross-Distro Fluency</text>
<text x="875" y="216" text-anchor="middle" fill="#3C6EB4" font-size="13" font-weight="700" >Fedora</text>
<text x="875" y="246" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >dnf · firewalld · SELinux</text>
<text x="875" y="264" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >what changes, what doesn't</text>
<circle r="9" fill="#e6edf3"><animateMotion dur="12s" repeatCount="indefinite" path="M125,110 L875,110"/></circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
