<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Shell comparison" xmlns:c2pa="http://c2pa.org/manifest">
<title>Shell comparison</title>
<rect width="1000" height="440" rx="18" fill="#0d1117"/>
<text x="500" y="38" text-anchor="middle" fill="#e6edf3" font-size="21" font-weight="700" >Shell Showdown: Bash, Zsh, Fish, PowerShell, CMD</text>
<text x="60" y="76" text-anchor="start" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">SHELL</text>
<text x="215" y="76" text-anchor="start" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">BORN</text>
<text x="290" y="76" text-anchor="start" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">DEFAULT ON</text>
<text x="500" y="76" text-anchor="start" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">PIPELINE</text>
<text x="610" y="76" text-anchor="start" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1.5">SUPERPOWER</text>
<rect x="30" y="92" width="940" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="30" y="92" width="8" height="50" rx="4" fill="#3fb950"/>
<text x="60" y="123" text-anchor="start" fill="#3fb950" font-size="17" font-weight="800" >Bash</text>
<text x="215" y="123" text-anchor="start" fill="#e6edf3" font-size="14" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >1989</text>
<text x="290" y="123" text-anchor="start" fill="#e6edf3" font-size="14" font-weight="400" >Ubuntu · Fedora</text>
<text x="500" y="123" text-anchor="start" fill="#e6edf3" font-size="14" font-weight="400" >text</text>
<text x="610" y="123" text-anchor="start" fill="#8b949e" font-size="13" font-weight="400" >The scripting standard, runs everywhere</text>
<rect x="30" y="150" width="940" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="30" y="150" width="8" height="50" rx="4" fill="#bc8cff"/>
<text x="60" y="181" text-anchor="start" fill="#bc8cff" font-size="17" font-weight="800" >Zsh</text>
<text x="215" y="181" text-anchor="start" fill="#e6edf3" font-size="14" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >1990</text>
<text x="290" y="181" text-anchor="start" fill="#e6edf3" font-size="14" font-weight="400" >macOS · Kali</text>
<text x="500" y="181" text-anchor="start" fill="#e6edf3" font-size="14" font-weight="400" >text</text>
<text x="610" y="181" text-anchor="start" fill="#8b949e" font-size="13" font-weight="400" >Plugins, themes, smarter completion</text>
<rect x="30" y="208" width="940" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="30" y="208" width="8" height="50" rx="4" fill="#d29922"/>
<text x="60" y="239" text-anchor="start" fill="#d29922" font-size="17" font-weight="800" >Fish</text>
<text x="215" y="239" text-anchor="start" fill="#e6edf3" font-size="14" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >2005</text>
<text x="290" y="239" text-anchor="start" fill="#e6edf3" font-size="14" font-weight="400" >none (opt-in)</text>
<text x="500" y="239" text-anchor="start" fill="#e6edf3" font-size="14" font-weight="400" >text</text>
<text x="610" y="239" text-anchor="start" fill="#8b949e" font-size="13" font-weight="400" >Autosuggestions and colours out of the box</text>
<rect x="30" y="266" width="940" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="30" y="266" width="8" height="50" rx="4" fill="#58a6ff"/>
<text x="60" y="297" text-anchor="start" fill="#58a6ff" font-size="17" font-weight="800" >PowerShell</text>
<text x="215" y="297" text-anchor="start" fill="#e6edf3" font-size="14" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >2006</text>
<text x="290" y="297" text-anchor="start" fill="#e6edf3" font-size="14" font-weight="400" >Windows</text>
<text x="500" y="297" text-anchor="start" fill="#d29922" font-size="14" font-weight="700" >objects</text>
<text x="610" y="297" text-anchor="start" fill="#8b949e" font-size="13" font-weight="400" >Object pipeline, also runs on Linux and macOS</text>
<rect x="30" y="324" width="940" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="30" y="324" width="8" height="50" rx="4" fill="#8b949e"/>
<text x="60" y="355" text-anchor="start" fill="#8b949e" font-size="17" font-weight="800" >CMD</text>
<text x="215" y="355" text-anchor="start" fill="#e6edf3" font-size="14" font-weight="400" font-family="SFMono-Regular, Consolas, Menlo, monospace" >1993</text>
<text x="290" y="355" text-anchor="start" fill="#e6edf3" font-size="14" font-weight="400" >Windows (legacy)</text>
<text x="500" y="355" text-anchor="start" fill="#e6edf3" font-size="14" font-weight="400" >text</text>
<text x="610" y="355" text-anchor="start" fill="#8b949e" font-size="13" font-weight="400" >Old .bat scripts, kept for compatibility</text>
<rect x="30" y="92" width="940" height="50" rx="10" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-width="2.5"><animate attributeName="y" values="92;150;208;266;324" keyTimes="0.00;0.20;0.40;0.60;0.80" calcMode="discrete" dur="10s" repeatCount="indefinite"/></rect>
<text x="500" y="428" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="400" >Linux and macOS shells pass text between commands. PowerShell passes objects.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
