<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="800" height="320" rx="16" fill="#0d1117"/>
<text x="400" y="36" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">What Happens When You Open an Application?</text>
<rect x="25" y="70" width="170" height="90" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="fill" values="#1f6feb;#161b22" keyTimes="0;0.1250" calcMode="discrete" dur="9.6s" repeatCount="indefinite"/></rect>
<circle cx="47" cy="92" r="12" fill="#58a6ff"/>
<text x="47" y="97" text-anchor="middle" fill="#0d1117" font-size="13" font-weight="700" >1</text>
<text x="110" y="128" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700" >Launch request</text>
<text x="110" y="148" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >user opens the app</text>
<text x="208" y="122" text-anchor="middle" fill="#8b949e" font-size="26" font-weight="400" >›</text>
<rect x="220" y="70" width="170" height="90" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="fill" values="#161b22;#1f6feb;#161b22" keyTimes="0;0.1250;0.2500" calcMode="discrete" dur="9.6s" repeatCount="indefinite"/></rect>
<circle cx="242" cy="92" r="12" fill="#58a6ff"/>
<text x="242" y="97" text-anchor="middle" fill="#0d1117" font-size="13" font-weight="700" >2</text>
<text x="305" y="128" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700" >Executable loading</text>
<text x="305" y="148" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >OS finds the file</text>
<text x="403" y="122" text-anchor="middle" fill="#8b949e" font-size="26" font-weight="400" >›</text>
<rect x="415" y="70" width="170" height="90" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="fill" values="#161b22;#1f6feb;#161b22" keyTimes="0;0.2500;0.3750" calcMode="discrete" dur="9.6s" repeatCount="indefinite"/></rect>
<circle cx="437" cy="92" r="12" fill="#58a6ff"/>
<text x="437" y="97" text-anchor="middle" fill="#0d1117" font-size="13" font-weight="700" >3</text>
<text x="500" y="128" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700" >Library loading</text>
<text x="500" y="148" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >shared libraries ready</text>
<text x="598" y="122" text-anchor="middle" fill="#8b949e" font-size="26" font-weight="400" >›</text>
<rect x="610" y="70" width="170" height="90" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="fill" values="#161b22;#1f6feb;#161b22" keyTimes="0;0.3750;0.5000" calcMode="discrete" dur="9.6s" repeatCount="indefinite"/></rect>
<circle cx="632" cy="92" r="12" fill="#58a6ff"/>
<text x="632" y="97" text-anchor="middle" fill="#0d1117" font-size="13" font-weight="700" >4</text>
<text x="695" y="128" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700" >Process creation</text>
<text x="695" y="148" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >OS creates a process</text>
<rect x="25" y="190" width="170" height="90" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="fill" values="#161b22;#1f6feb;#161b22" keyTimes="0;0.5000;0.6250" calcMode="discrete" dur="9.6s" repeatCount="indefinite"/></rect>
<circle cx="47" cy="212" r="12" fill="#58a6ff"/>
<text x="47" y="217" text-anchor="middle" fill="#0d1117" font-size="13" font-weight="700" >5</text>
<text x="110" y="248" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700" >Memory allocation</text>
<text x="110" y="268" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >virtual memory assigned</text>
<text x="208" y="242" text-anchor="middle" fill="#8b949e" font-size="26" font-weight="400" >›</text>
<rect x="220" y="190" width="170" height="90" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="fill" values="#161b22;#1f6feb;#161b22" keyTimes="0;0.6250;0.7500" calcMode="discrete" dur="9.6s" repeatCount="indefinite"/></rect>
<circle cx="242" cy="212" r="12" fill="#58a6ff"/>
<text x="242" y="217" text-anchor="middle" fill="#0d1117" font-size="13" font-weight="700" >6</text>
<text x="305" y="248" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700" >Thread creation</text>
<text x="305" y="268" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >one or more threads</text>
<text x="403" y="242" text-anchor="middle" fill="#8b949e" font-size="26" font-weight="400" >›</text>
<rect x="415" y="190" width="170" height="90" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="fill" values="#161b22;#1f6feb;#161b22" keyTimes="0;0.7500;0.8750" calcMode="discrete" dur="9.6s" repeatCount="indefinite"/></rect>
<circle cx="437" cy="212" r="12" fill="#58a6ff"/>
<text x="437" y="217" text-anchor="middle" fill="#0d1117" font-size="13" font-weight="700" >7</text>
<text x="500" y="248" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700" >CPU scheduling</text>
<text x="500" y="268" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >scheduler gives CPU time</text>
<text x="598" y="242" text-anchor="middle" fill="#8b949e" font-size="26" font-weight="400" >›</text>
<rect x="610" y="190" width="170" height="90" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"><animate attributeName="fill" values="#161b22;#1f6feb" keyTimes="0;0.8750" calcMode="discrete" dur="9.6s" repeatCount="indefinite"/></rect>
<circle cx="632" cy="212" r="12" fill="#58a6ff"/>
<text x="632" y="217" text-anchor="middle" fill="#0d1117" font-size="13" font-weight="700" >8</text>
<text x="695" y="248" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700" >Execution</text>
<text x="695" y="268" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="400" >app starts working</text>
<text x="400" y="300" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >Each step lights up in order, then the cycle repeats</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
