<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 316" width="800" height="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="800" height="316" rx="16" fill="#0d1117"/>
<text x="400" y="36" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">Deadlock: A Circular Wait</text>
<defs>
  <style>
    @media (prefers-color-scheme: light) {
      /* Backgrounds & Cards */
      rect[fill="url(#bg)"], rect[fill="#0b0f1a"], rect[fill="#0d1117"], rect[fill="#0a0d14"], rect[fill="#0e1320"], rect[fill="#121826"] {
        fill: #f6f8fa !important;
      }
      linearGradient#bg stop:nth-child(1) { stop-color: #ffffff !important; }
      linearGradient#bg stop:nth-child(2) { stop-color: #f6f8fa !important; }
      linearGradient#bg stop:nth-child(3) { stop-color: #edf2f7 !important; }

      rect[fill="#161b22"], rect[fill="#151b28"], rect[fill="#1a2030"] {
        fill: #ffffff !important;
        stroke: #d0d7de !important;
      }
      rect[fill="#0d1117"], rect[fill="#101522"] { fill: #f6f8fa !important; }
      rect[stroke="#30363d"], line[stroke="#30363d"] { stroke: #d0d7de !important; }
      rect[stroke="#21262d"], line[stroke="#21262d"] { stroke: #d0d7de !important; }

      /* Typography */
      text[fill="#ffffff"], text[fill="#e6edf3"], text[fill="#f0f6fc"], text[fill="#f8fafc"] {
        fill: #1f2328 !important;
      }
      text[fill="#8b949e"], text[fill="#c9d1d9"], text[fill="#94a3b8"] {
        fill: #57606a !important;
      }
      text[fill="#7d8590"] { fill: #656d76 !important; }

      /* Shapes & Patterns */
      pattern circle { fill: #0969da !important; opacity: 0.07 !important; }
      circle[fill="#0d1117"], circle[fill="#161b22"], circle[fill="#0b0f1a"] { fill: #ffffff !important; }
    }
  </style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker></defs>
<line x1="240" y1="100" x2="556" y2="100" stroke="#f85149" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar)"/>
<line x1="600" y1="140" x2="600" y2="190" stroke="#3fb950" stroke-width="3" marker-end="url(#ag)"/>
<line x1="562" y1="230" x2="246" y2="230" stroke="#f85149" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar)"/>
<line x1="200" y1="190" x2="200" y2="140" stroke="#3fb950" stroke-width="3" marker-end="url(#ag)"/>
<text x="400" y="88" text-anchor="middle" fill="#f85149" font-size="12" font-weight="400" >A waits for Resource 2</text>
<text x="612" y="170" text-anchor="start" fill="#3fb950" font-size="12" font-weight="400" >held by B</text>
<text x="400" y="254" text-anchor="middle" fill="#f85149" font-size="12" font-weight="400" >B waits for Resource 1</text>
<text x="188" y="170" text-anchor="end" fill="#3fb950" font-size="12" font-weight="400" >held by A</text>
<circle cx="200" cy="100" r="38" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
<text x="200" y="96" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="700" >Process</text>
<text x="200" y="114" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="800" >A</text>
<circle cx="600" cy="230" r="38" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
<text x="600" y="226" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="700" >Process</text>
<text x="600" y="244" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="800" >B</text>
<rect x="560" y="60" width="80" height="80" rx="10" fill="#161b22" stroke="#d29922" stroke-width="3"/>
<text x="600" y="96" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="700" >Resource</text>
<text x="600" y="114" text-anchor="middle" fill="#d29922" font-size="15" font-weight="800" >2</text>
<rect x="160" y="190" width="80" height="80" rx="10" fill="#161b22" stroke="#d29922" stroke-width="3"/>
<text x="200" y="226" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="700" >Resource</text>
<text x="200" y="244" text-anchor="middle" fill="#d29922" font-size="15" font-weight="800" >1</text>
<text x="400" y="172" text-anchor="middle" fill="#f85149" font-size="28" font-weight="800">DEADLOCK<animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></text>
<text x="400" y="196" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="400" >nobody can continue</text>
<circle r="6" fill="#f85149"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M200,100 L600,100 L600,230 L200,230 Z"/></circle>
<circle r="6" fill="#f85149"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M200,100 L600,100 L600,230 L200,230 Z"/></circle>
<text x="400" y="296" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="400" >Each process holds one resource and waits for the other. The wait goes around in a circle.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
